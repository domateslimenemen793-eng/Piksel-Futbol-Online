      }
      case 'friend.add': {
        const t = tgt();
        if (!t || !t.card) return fail('Oyuncu bulunamadı.');
        if (t === u) return fail('Kendini ekleyemezsin.');
        if (u.friends.includes(t.name)) return fail('Zaten arkadaşsınız.');
        if (u.blocked.includes(t.name)) return fail('Önce bu oyuncunun engelini kaldırmalısın.');
        if (t.blocked.includes(u.name)) return fail('Bu oyuncuya istek gönderilemiyor.');
        if (u.freq.includes(t.name)) {                         // karşılıklı istek: otomatik kabul
          if (u.friends.length >= MAX_FRIENDS || t.friends.length >= MAX_FRIENDS) return fail('Arkadaş listesi dolu (' + MAX_FRIENDS + ').');
          return this.befriend(u, t);
        }
        if (t.freq.includes(u.name)) return fail('İstek zaten gönderildi.');
        if (u.friends.length >= MAX_FRIENDS) return fail('Arkadaş listen dolu (' + MAX_FRIENDS + ').');
        if (t.freq.length >= MAX_REQ) return fail('Bu oyuncunun istek kutusu dolu.');
        t.freq.push(u.name); st.putUser(t);
        this.sendTo(t.name, { t: 'notice', kind: 'gold', text: u.name + ' sana arkadaşlık isteği gönderdi.' });
        this.pushMe(t.name); this.pushMe(u.name);
        return ok(t.name + ' kişisine arkadaşlık isteği gönderildi.');
      }
      case 'friend.accept': {
        const t = tgt();
        if (!t || !u.freq.includes(t.name)) return fail('Bu isteği bulamadım.');
        if (u.friends.length >= MAX_FRIENDS || t.friends.length >= MAX_FRIENDS) return fail('Arkadaş listesi dolu (' + MAX_FRIENDS + ').');
        return this.befriend(u, t);
      }
      case 'friend.decline': {
        const t = tgt();
        if (!t) return fail('Oyuncu bulunamadı.');
        drop(u.freq, t.name); st.putUser(u);
        return this.pushMe(u.name);
      }
      case 'friend.remove': {
        const t = tgt();
        if (!t) return fail('Oyuncu bulunamadı.');
        // gönderilmiş ama cevaplanmamış istek de bu yolla geri çekilebilir
        drop(u.friends, t.name); drop(t.friends, u.name); drop(t.freq, u.name);
        st.putUser(u); st.putUser(t);
        this.pushMe(u.name); this.pushMe(t.name);
        return undefined;
      }
      case 'block': {
        const t = tgt();
        if (!t || t === u) return fail('Oyuncu bulunamadı.');
        if (u.blocked.includes(t.name)) return undefined;
        if (u.blocked.length >= MAX_BLOCK) return fail('Engel listesi dolu (' + MAX_BLOCK + ').');
        u.blocked.push(t.name);
        drop(u.friends, t.name); drop(t.friends, u.name); drop(u.freq, t.name); drop(t.freq, u.name);
        st.putUser(u); st.putUser(t);
        this.pushMe(u.name); this.pushMe(t.name);
        return ok(t.name + ' engellendi.');
      }
      case 'unblock': {
        const t = tgt();
        if (!t) return fail('Oyuncu bulunamadı.');
        drop(u.blocked, t.name); st.putUser(u);
        this.pushMe(u.name);
        return ok(t.name + ' engeli kaldırıldı.');
      }
      case 'mute': {
        const t = tgt();
        if (!t || t === u) return fail('Oyuncu bulunamadı.');
        if (u.muted.includes(t.name)) return undefined;
        if (u.muted.length >= MAX_MUTE) return fail('Susturulanlar listesi dolu (' + MAX_MUTE + ').');
        u.muted.push(t.name); st.putUser(u);
        this.pushMe(u.name);
        return ok(t.name + ' susturuldu: mesajlarını görmeyeceksin.');
      }
      case 'unmute': {
        const t = tgt();
        if (!t) return fail('Oyuncu bulunamadı.');
        drop(u.muted, t.name); st.putUser(u);
        this.pushMe(u.name);
        return ok(t.name + ' susturması kaldırıldı.');
      }
      case 'report': {
        const t = tgt();
        if (!t || t === u) return fail('Oyuncu bulunamadı.');
        const reason = REPORT_REASONS.includes(m.reason) ? m.reason : 'diger';
        if (!this.guard(conn, 'rep:' + key(u.name), 5, 3600000)) return fail('Çok fazla şikayet gönderdin, biraz bekle.');
        if (!this.guard(conn, 'rep:' + key(u.name) + '>' + key(t.name), 1, 86400000)) return fail('Bu oyuncuyu zaten şikayet ettin.');
        const id = now.toString(36) + Math.random().toString(36).slice(2, 7);
        st.putDoc('rep', id, { id, by: u.name, name: t.name, reason, text: clean(m.text, 140), at: now });
        this.m.reports++;
        // otomatik önlem: 24 saatte 5 farklı kişi şikayet ederse sohbet 10 dakika kısıtlanır
        const log = (this.repLog || (this.repLog = new Map())), k = key(t.name);
        const arr = (log.get(k) || []).filter((r) => now - r.at < 86400000);
        if (!arr.some((r) => r.by === u.name)) arr.push({ by: u.name, at: now });
        log.set(k, arr);
        if (arr.length >= 5 && t.chatBan < now) {
          t.chatBan = now + 600000; st.putUser(t);
          this.sendTo(t.name, { t: 'notice', kind: 'err', text: 'Çok sayıda şikayet aldığın için sohbetin 10 dakika kısıtlandı.' });
        }
        return ok('Şikayetin alındı. Teşekkürler.');
      }
      default: return undefined;
    }
  };

  // Transfer Pazarı: 10 sn önbellekli, değer ve istatistik sıralamaları
  P.marketRows = function () {
    const t = this.now();
    if (this.mkCache && t - this.mkAt < 10000) return this.mkCache;
    const rows = [];
    let value = 0, ovrSum = 0, g = 0, a = 0;
    for (const x of this.store.users.values()) {
      if (!x.card) continue;
      const v = cardView(x.name, x.card), s = x.stats, val = marketValue(v.ovr, x.card.lvl, s);
      rows.push({ name: x.name, pos: v.pos, ovr: v.ovr, tier: v.tier, lvl: x.card.lvl, value: val, g: s.g, a: s.a, m: s.m, cs: s.cs,
        mmr: x.mmr, clan: x.clan, country: x.country, look: v.look });
      value += val; ovrSum += v.ovr; g += s.g; a += s.a;
    }
    const by = (k) => rows.slice().sort((p, q) => q[k] - p[k] || q.ovr - p.ovr || (p.name < q.name ? -1 : 1));
    this.mkCache = { rows, sorted: { value: by('value'), ovr: by('ovr'), g: by('g'), a: by('a'), lvl: by('lvl') },
      sum: { n: rows.length, value, avgOvr: rows.length ? Math.round(ovrSum / rows.length) : 0, g, a } };
    this.mkAt = t;
    return this.mkCache;
  };
};

};
defs["src/server/store.js"]=function(module,exports,require){
'use strict';
/* Depo: kullanıcılar ve klanlar bellekte tutulur; değişiklikler günlüğe (journal) eklenir.
   - Yazmalar toplu ve asenkron (250 ms'de bir), oyun döngüsünü bloklamaz.
   - Çökme durumunda: snapshot + günlük yeniden oynatılarak tam durum geri gelir.
   - MemoryStore aynı arayüzü dosyasız sunar (testler ve tarayıcıdaki çevrimdışı mod için). */

const key = (s) => String(s).toLowerCase();

class MemoryStore {
  constructor() { this.users = new Map(); this.clans = new Map(); this.byToken = new Map(); this.cols = new Map(); }
  load() { return this; }
  // genel belge koleksiyonları (topluluklar, özel mesajlar, şikayetler …): koleksiyon -> (id -> değer)
  docs(coll) { let m = this.cols.get(coll); if (!m) { m = new Map(); this.cols.set(coll, m); } return m; }
  putDoc(coll, id, v) { this.docs(coll).set(id, v); }
  delDoc(coll, id) { this.docs(coll).delete(id); }
  putUser(u) { this.users.set(key(u.name), u); if (u.token) this.byToken.set(u.token, u); }
  putClan(c) { this.clans.set(key(c.tag), c); }
  delClan(tag) { this.clans.delete(key(tag)); }
  getUser(name) { return this.users.get(key(name)) || null; }
  getClan(tag) { return this.clans.get(key(tag)) || null; }
  byTokenGet(t) { return this.byToken.get(t) || null; }
  rotateToken(u, t) { if (u.token) this.byToken.delete(u.token); u.token = t; this.byToken.set(t, u); }
  flushSync() {}
  close() {}
}

class FileStore extends MemoryStore {
  constructor(dir, opts) {
    super();
    this.dir = dir; this.opts = Object.assign({ flushMs: 250, compactAt: 50000 }, opts || {});
    this.fs = require('fs'); this.path = require('path');
    this.snapPath = this.path.join(dir, 'snapshot.json');
    this.jPath = this.path.join(dir, 'journal.log');
    this.buf = []; this.writing = false; this.timer = null; this.lines = 0; this.closed = false;
  }

  load() {
    const fs = this.fs;
    fs.mkdirSync(this.dir, { recursive: true });
    if (fs.existsSync(this.snapPath)) {
      const s = JSON.parse(fs.readFileSync(this.snapPath, 'utf8'));
      for (const u of s.users || []) this._u(u);
      for (const c of s.clans || []) this.clans.set(key(c.tag), c);
      for (const [coll, o] of Object.entries(s.docs || {})) for (const [id, v] of Object.entries(o)) this.docs(coll).set(id, v);
    }
    if (fs.existsSync(this.jPath)) {
      const lines = fs.readFileSync(this.jPath, 'utf8').split('\n');
      for (const ln of lines) {
        if (!ln) continue;
        let r; try { r = JSON.parse(ln); } catch (e) { continue; }   // yarım kalmış son satırı yok say
        this.lines++;
        if (r.k === 'u') this._u(r.v);
        else if (r.k === 'c') this.clans.set(key(r.v.tag), r.v);
        else if (r.k === 'd') this.clans.delete(key(r.v));
        else if (r.k === 'p') this.docs(r.c).set(r.i, r.v);
        else if (r.k === 'x') this.docs(r.c).delete(r.i);
      }
    }
    if (this.lines > 0) this.compact();
    return this;
  }

  _u(u) {
    const old = this.users.get(key(u.name));
    if (old && old.token && old.token !== u.token) this.byToken.delete(old.token);
    this.users.set(key(u.name), u);
    if (u.token) this.byToken.set(u.token, u);
  }

  _q(rec) {
    if (this.closed) return;
    this.buf.push(JSON.stringify(rec));
    if (!this.timer) this.timer = setTimeout(() => { this.timer = null; this.flush(); }, this.opts.flushMs);
    if (this.timer.unref) this.timer.unref();
  }

  putUser(u) { super.putUser(u); this._q({ k: 'u', v: u }); }
  putClan(c) { super.putClan(c); this._q({ k: 'c', v: c }); }
  delClan(tag) { super.delClan(tag); this._q({ k: 'd', v: tag }); }
  putDoc(coll, id, v) { super.putDoc(coll, id, v); this._q({ k: 'p', c: coll, i: id, v }); }
  delDoc(coll, id) { super.delDoc(coll, id); this._q({ k: 'x', c: coll, i: id }); }

  flush() {
    if (this.writing || !this.buf.length) return;
    const data = this.buf.join('\n') + '\n', n = this.buf.length;
    this.buf.length = 0; this.writing = true;
    this.fs.appendFile(this.jPath, data, (err) => {
      this.writing = false;
      if (err) console.error('[depo] günlük yazılamadı:', err.message);
      else { this.lines += n; if (this.lines > this.opts.compactAt) this.compact(); }
      if (this.buf.length && !this.closed) this.flush();
    });
  }

  // snapshot'ı atomik yaz (tmp + rename), günlüğü sıfırla
  compact() {
    const fs = this.fs;
    this.flushSync();
    const tmp = this.snapPath + '.tmp';
    const docs = {};
    for (const [coll, m] of this.cols) docs[coll] = Object.fromEntries(m);
    fs.writeFileSync(tmp, JSON.stringify({ users: [...this.users.values()], clans: [...this.clans.values()], docs }));
    fs.renameSync(tmp, this.snapPath);
    fs.writeFileSync(this.jPath, '');
    this.lines = 0;
  }

  flushSync() {
    if (this.timer) { clearTimeout(this.timer); this.timer = null; }
    if (this.buf.length) {
      this.fs.appendFileSync(this.jPath, this.buf.join('\n') + '\n');
      this.lines += this.buf.length; this.buf.length = 0;
    }
  }

  close() { this.flushSync(); this.closed = true; }
}

module.exports = { MemoryStore, FileStore, key };

};
defs["src/server/util.js"]=function(module,exports,require){
'use strict';
/* Sunucu modüllerinin ortak yardımcıları. */

// kullanıcı metnini temizler: denetim karakterleri ve < > çıkar, boşlukları tekle, kırp
function cleanText(s, max) {
  if (typeof s !== 'string') return '';
  return s.replace(/[\u0000-\u001f\u007f<>]/g, '').replace(/\s+/g, ' ').trim().slice(0, max);
}

const CODE_CHARS = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
function randCode(n) {
  let c = '';
  for (let i = 0; i < n; i++) c += CODE_CHARS[Math.floor(Math.random() * CODE_CHARS.length)];
  return c;
}

module.exports = { cleanText, randCode, CODE_CHARS };

};

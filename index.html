    p.kickCd = 0.3; p.noCtl = 0.3; p.kickAnim = 0.25; p.dir = ang;
    this.ev |= EV.KICK;
    return true;
  }

  collidePlayers() {
    const pl = this.players, n = pl.length, d2 = 4 * PR * PR;
    for (let i = 0; i < n; i++) {
      const a = pl[i];
      for (let j = i + 1; j < n; j++) {
        const c = pl[j];
        const dx = c.x - a.x, dy = c.y - a.y, q = dx * dx + dy * dy;
        if (q >= d2) continue;
        const d = Math.sqrt(q) || 0.001, nx = dx / d, ny = dy / d, ov = 2 * PR - d;
        const ma = a.d.mass * (a.lunge > 0 ? 2.5 : 1), mc = c.d.mass * (c.lunge > 0 ? 2.5 : 1), tot = ma + mc;
        a.x -= nx * ov * mc / tot; a.y -= ny * ov * mc / tot;
        c.x += nx * ov * ma / tot; c.y += ny * ov * ma / tot;
        const rvn = (c.vx - a.vx) * nx + (c.vy - a.vy) * ny;
        if (rvn < 0) {
          const imp = -1.15 * rvn / (1 / ma + 1 / mc);
          a.vx -= imp * nx / ma; a.vy -= imp * ny / ma;
          c.vx += imp * nx / mc; c.vy += imp * ny / mc;
        }
        if (a.team !== c.team) {
          if (a.lunge > 0) this.lungeHit(a, c); else if (c.lunge > 0) this.lungeHit(c, a);
        }
      }
    }
    for (let i = 0; i < n; i++) {
      const p = pl[i];
      p.x = clamp(p.x, PR, this.W - PR); p.y = clamp(p.y, PR, this.H - PR);
    }
  }

  lungeHit(l, v) {
    if (v.stun > 0 || v.skill > 0) return;       // yetenek kullanan oyuncu kaymadan sıyrılır
    // top gerçekten ayağa/gövdeye değmediyse dripling bozulmaz, rakip düşmez
    const bd = Math.hypot(this.ball.x - l.x, this.ball.y - l.y);
    if (this.ball.owner === v.i && bd > PR * l.d.reach + BR + 3) return;
    v.stun = 0.35; v.noCtl = 0.5; v.chargeT = 0;
    const b = this.ball;
    if (v.hold > 0) { v.hold = 0; b.hold = -1; }
    if (b.owner === v.i) {
      b.owner = -1;
      b.vx += Math.cos(l.dir) * 260 * SPD * l.d.tackle; b.vy += Math.sin(l.dir) * 260 * SPD * l.d.tackle;
      this.touch(l);
    }
    this.ev |= EV.WALL;
  }

  updateBall(dt, live) {
    const b = this.ball;
    if (b.hold >= 0) {
      const g = this.players[b.hold];
      if (!live || g.hold <= 0) b.hold = -1;
      else {
        const o = PR * g.d.reach + BR;
        b.x = clamp(g.x + Math.cos(g.dir) * o, BR + 2, this.W - BR - 2); b.y = clamp(g.y + Math.sin(g.dir) * o, BR + 2, this.H - BR - 2);
        b.vx = g.vx; b.vy = g.vy; b.owner = g.i;
        return;
      }
    }
    if (live) this.contactBall(dt);
    let sp = Math.sqrt(b.vx * b.vx + b.vy * b.vy);
    if (sp > BALL_MAX) { b.vx *= BALL_MAX / sp; b.vy *= BALL_MAX / sp; sp = BALL_MAX; }
    const steps = Math.max(1, Math.ceil(sp * dt / 8)), h = dt / steps;
    for (let s = 0; s < steps; s++) {
      b.x += b.vx * h; b.y += b.vy * h;
      const g = this.wallsBall();
      if (g >= 0 && live) { this.scoreGoal(g); break; }
    }
    const damp = Math.exp(-BALL_DAMP * dt);
    b.vx *= damp; b.vy *= damp;
    if (b.x < 0 || b.x > this.W) { b.vx *= 0.94; b.vy *= 0.94; }
    if (sp < 2) { b.vx = 0; b.vy = 0; }
    // köşede sıkışan top: tabela yok, taç/korner yok; top duvarlardan sekerek oyunda kalır, köşeye yapışırsa hafifçe içeri itilir
    if (live && sp < 40 && (b.x < 22 || b.x > this.W - 22) && (b.y < 22 || b.y > this.H - 22)) {
      b.vx += (this.W / 2 - b.x) * 0.02; b.vy += (this.CY - b.y) * 0.02;
    }
  }

  contactBall(dt) {
    const b = this.ball, pl = this.players, n = pl.length;
    let ctl = -1, best = 1e9;
    for (let i = 0; i < n; i++) {
      const p = pl[i];
      if (p.noCtl > 0 || p.stun > 0 || p.lunge > 0) continue;
      const dx = b.x - p.x, dy = b.y - p.y, d = Math.sqrt(dx * dx + dy * dy);
      if (d >= PR * p.d.reach + BR + CTL_RANGE) continue;
      const rs = Math.sqrt((b.vx - p.vx) * (b.vx - p.vx) + (b.vy - p.vy) * (b.vy - p.vy));
      if (rs > (p.d.gk ? 480 + 380 * p.d.gk : 330 + 120 * p.d.ctl) * SPD) continue;
      const sc = d - (i === b.owner ? 6 : 0) - 2 * p.d.ctl;
      if (sc < best) { best = sc; ctl = i; }
    }
    for (let i = 0; i < n; i++) {
      const p = pl[i];
      let dx = b.x - p.x, dy = b.y - p.y, d = Math.sqrt(dx * dx + dy * dy);
      const rch = PR * p.d.reach + BR;
      if (d >= rch) continue;
      if (d < 0.001) { dx = 1; dy = 0; d = 1; }
      const nx = dx / d, ny = dy / d;
      b.x = p.x + nx * rch; b.y = p.y + ny * rch;
      const vn = (b.vx - p.vx) * nx + (b.vy - p.vy) * ny;
      if (i === ctl) { if (vn < 0) { b.vx -= vn * nx; b.vy -= vn * ny; } }
      else {
        if (vn < 0) { const k = 1 + (p.lunge > 0 ? 0.9 : 0.35); b.vx -= k * vn * nx; b.vy -= k * vn * ny; }
        if (p.lunge > 0) { b.vx += Math.cos(p.dir) * 220 * SPD * p.d.tackle; b.vy += Math.sin(p.dir) * 220 * SPD * p.d.tackle; }
        this.touch(p);
      }
    }
    if (ctl < 0) { b.owner = -1; return; }
    const c = pl[ctl];
    this.touch(c);
    b.owner = ctl;
    if (c.d.gk > 0 && c.hold <= 0 && c.kickCd <= 0) {
      c.hold = HOLD_MAX; b.hold = c.i; this.ev |= EV.SAVE;
      c.dir = c.team === 0 ? 0 : Math.PI; c.vx *= 0.25; c.vy *= 0.25;     // sahaya dönük tutar
      if (b.prev >= 0 && pl[b.prev].team !== c.team) c.saves++;
      return;
    }
    const cd = PR * c.d.reach + BR + 1;
    const tx = c.x + Math.cos(c.dir) * cd, ty = c.y + Math.sin(c.dir) * cd;
    const kv = 1 - Math.exp(-(6 + 8 * c.d.ctl) * dt), kk = (30 + 40 * c.d.ctl) * dt;
    b.vx += (c.vx - b.vx) * kv + (tx - b.x) * kk;
    b.vy += (c.vy - b.vy) * kv + (ty - b.y) * kk;
  }

  post(px, py) {
    const b = this.ball, dx = b.x - px, dy = b.y - py, r = BR + POST_R;
    const q = dx * dx + dy * dy;
    if (q >= r * r) return;
    const d = Math.sqrt(q) || 0.001, nx = dx / d, ny = dy / d;
    b.x = px + nx * r; b.y = py + ny * r;
    const vn = b.vx * nx + b.vy * ny;
    if (vn < 0) { b.vx -= (1 + POST_REST) * vn * nx; b.vy -= (1 + POST_REST) * vn * ny; this.ev |= EV.POST; }
  }

  // duvarlar, direkler, kale ağı; gol olursa gol atan takımı döndürür (yoksa -1)
  wallsBall() {
    const b = this.ball, W = this.W, H = this.H, cy = this.CY, hg = this.GW / 2;
    if (b.x < 30 || b.x > W - 30) {
      this.post(0, cy - hg); this.post(0, cy + hg); this.post(W, cy - hg); this.post(W, cy + hg);
    }
    const inMouth = Math.abs(b.y - cy) < hg;
    if (b.x < BR) {
      if (inMouth) {
        if (b.x < -GOAL_DEPTH + BR) { b.x = -GOAL_DEPTH + BR; b.vx = -b.vx * 0.3; }
        if (b.x < 0) {
          if (b.y < cy - hg + BR) { b.y = cy - hg + BR; b.vy = -b.vy * 0.5; }
          else if (b.y > cy + hg - BR) { b.y = cy + hg - BR; b.vy = -b.vy * 0.5; }
        }
        if (b.x < -BR) return 1;
      } else { b.x = BR; if (b.vx < 0) { b.vx = -b.vx * WALL_REST; this.ev |= EV.WALL; } }
    } else if (b.x > W - BR) {
      if (inMouth) {
        if (b.x > W + GOAL_DEPTH - BR) { b.x = W + GOAL_DEPTH - BR; b.vx = -b.vx * 0.3; }
        if (b.x > W) {
          if (b.y < cy - hg + BR) { b.y = cy - hg + BR; b.vy = -b.vy * 0.5; }
          else if (b.y > cy + hg - BR) { b.y = cy + hg - BR; b.vy = -b.vy * 0.5; }
        }
        if (b.x > W + BR) return 0;
      } else { b.x = W - BR; if (b.vx > 0) { b.vx = -b.vx * WALL_REST; this.ev |= EV.WALL; } }
    }
    if (b.x >= 0 && b.x <= W) {
      if (b.y < BR) { b.y = BR; if (b.vy < 0) { b.vy = -b.vy * WALL_REST; this.ev |= EV.WALL; } }
      else if (b.y > H - BR) { b.y = H - BR; if (b.vy > 0) { b.vy = -b.vy * WALL_REST; this.ev |= EV.WALL; } }
    }
    return -1;
  }

  scoreGoal(team) {
    const b = this.ball, pl = this.players;
    this.score[team]++;
    let scorer = -1, assist = -1, og = false;
    const H = b.hist, now = this.time;
    let si = -1;
    for (let k = 0; k < H.length; k++) if (pl[H[k].i].team === team && now - H[k].t < 3.5) { si = k; break; }
    if (si >= 0) {                                   // gol atan takımdan yakın zamanda dokunan var (sektirme dahil)
      scorer = H[si].i; pl[scorer].goals++;
      for (let k = si + 1; k < H.length; k++) {
        if (pl[H[k].i].team === team && H[k].i !== scorer && now - H[k].t < 6) { assist = H[k].i; pl[assist].assists++; break; }
      }
    } else if (H.length) {
      scorer = H[0].i;
      if (pl[scorer].team === team) pl[scorer].goals++; else og = true;
    }
    const g = { t: Math.floor(this.time), team, scorer, assist, og };
    this.goals.push(g); this.lastGoal = g;
    this.phase = PHASE.GOAL; this.phaseT = 3.2; this.ev |= EV.GOAL;
    this.kickoffTeam = 1 - team;
    b.owner = -1; b.hold = -1;
  }

  result() {
    return {
      score: this.score.slice(), winner: this.winner, golden: this.golden, goals: this.goals.slice(),
      players: this.players.map((p) => ({ i: p.i, goals: p.goals, assists: p.assists, saves: p.saves, shots: p.shots, touches: p.touches, cs: p.cs })),
    };
  }
}

module.exports = { Sim, movePlayer, slotFor, angdiff, BASE_SPEED, SPRINT_MULT, LUNGE_TIME, CHARGE_MAX, HOLD_MAX };

};
defs["src/server/admin.js"]=function(module,exports,require){
'use strict';
/* Yönetim: roller (owner = Ana Admin, mod = alt admin/moderatör), isim rengi, küresel susturma (mute) ve yasak (ban).
   Küresel susturma sohbet kutusunu süre bitene kadar kilitler (kanallar + DM). Yasak: oyuncu odalara giremez, maç oynayamaz.
   Kişisel susturma (oyuncunun kendi listesi) social.js'te; yalnızca o oyuncunun ekranında mesajları gizler. */
const { key } = require("src/server/store.js");
const { cleanText: clean } = require("src/server/util.js");

const MIN = 60000;
const DURATIONS = [30, 60, 300, 600, 1440, -1];           // dk: 30 dk, 1 sa, 5 sa, 10 sa, 24 sa, kalıcı
const COLORS = ['#ffd75a', '#ff5a6e', '#4da3ff', '#3ddc84', '#c58bff', '#ff9f43', '#5ee0c8', '#ffffff'];

module.exports = function install(Hub) {
  const P = Hub.prototype;
  const isAdmin = (u) => u.role === 'owner' || u.role === 'mod';
  P.isAdmin = isAdmin;
  P.adminColors = COLORS;

  // kalan süre: 0 yok, -1 kalıcı, >0 ms
  P.muteLeft = function (u, now) {
    if (!u.muteUntil) return 0;
    if (u.muteUntil < 0) return -1;
    const r = u.muteUntil - now;
    if (r <= 0) { u.muteUntil = 0; return 0; }
    return r;
  };
  P.banLeft = function (u, now) {
    if (!u.banUntil) return 0;
    if (u.banUntil < 0) return -1;
    const r = u.banUntil - now;
    if (r <= 0) { u.banUntil = 0; return 0; }
    return r;
  };
  P.fmtLeft = function (ms) {
    if (ms < 0) return 'kalıcı';
    const m = Math.ceil(ms / MIN);
    return m >= 60 ? Math.floor(m / 60) + ' sa ' + (m % 60 ? (m % 60) + ' dk' : '') : m + ' dk';
  };

  // aktör hedefe işlem yapabilir mi? owner herkese (owner hariç), mod yalnızca rolsüz oyunculara
  const canAct = (a, t) => (a.role === 'owner' ? t.role !== 'owner' : a.role === 'mod' && !t.role);

  P.adminMsg = function (conn, m) {
    const u = conn.user, st = this.store, now = this.now();
    const fail = (msg) => this.err(conn, 'admin', msg);
    const ok = (text) => this.send(conn, { t: 'notice', kind: 'ok', text });
    if (!isAdmin(u)) return fail('Bu işlem için yetkin yok.');
    if (m.t === 'admin.color') {
      if (!COLORS.includes(m.c)) return fail('Geçersiz renk.');
      u.nc = m.c; st.putUser(u); this.mkCache = null;
      this.send(conn, { t: 'me', me: this.meView(u) });
      return ok('İsim rengin güncellendi.');
    }
    const t = st.getUser(clean(m.name, 16));
    if (!t) return fail('Oyuncu bulunamadı.');
    if (t === u) return fail('Bu işlemi kendine uygulayamazsın.');
    const log = (what) => { const id = now.toString(36) + Math.random().toString(36).slice(2, 6); st.putDoc('modlog', id, { id, by: u.name, to: t.name, what, at: now }); };
    switch (m.t) {
      case 'admin.mute': case 'admin.ban': {
        if (!canAct(u, t)) return fail('Bu oyuncuya işlem yapma yetkin yok.');
        const mins = Math.floor(Number(m.mins));
        const clear = mins === 0;
        if (!clear && !DURATIONS.includes(mins)) return fail('Geçersiz süre.');
        const until = clear ? 0 : mins < 0 ? -1 : now + mins * MIN;
        const mute = m.t === 'admin.mute';
        if (mute) t.muteUntil = until; else t.banUntil = until;
        st.putUser(t); log((mute ? 'mute ' : 'ban ') + mins);
        const label = mins < 0 ? 'kalıcı olarak' : this.fmtLeft(mins * MIN) + ' süreyle';
        if (clear) this.sendTo(t.name, { t: 'notice', kind: 'ok', text: mute ? 'Susturman kaldırıldı.' : 'Yasağın kaldırıldı.' });
        else this.sendTo(t.name, { t: 'notice', kind: 'err', text: mute ? 'Bir admin seni ' + label + ' susturdu: mesaj gönderemezsin.' : 'Bir admin seni ' + label + ' yasakladı: odalara giremez ve maç oynayamazsın.' });
        if (!mute && !clear) {                                  // yasaklı oyuncu kuyruktan / odadan çıkarılır (maçtaysa yerine bot geçer)
          const c = this.online.get(key(t.name));
          if (c) { this.dropQueue(c); this.send(c, { t: 'queue', mode: 0 }); if (c.room) this.leaveRoom(c, true); }
        }
        this.pushMe(t.name);
        return ok(t.name + ': ' + (clear ? (mute ? 'susturma kaldırıldı' : 'yasak kaldırıldı') : (mute ? 'susturuldu (' : 'yasaklandı (') + (mins < 0 ? 'kalıcı' : this.fmtLeft(mins * MIN)) + ')') + '.');
      }
      case 'admin.promote': case 'admin.demote': {
        if (u.role !== 'owner') return fail('Sadece Ana Admin alt admin atayabilir.');
        if (t.role === 'owner') return fail('Ana Admin\'in yetkisi değiştirilemez.');
        if (m.t === 'admin.promote') { if (!t.card) return fail('Oyuncunun kartı yok.'); t.role = 'mod'; } else { t.role = ''; t.nc = ''; }
        st.putUser(t); log(m.t); this.mkCache = null;
        this.sendTo(t.name, { t: 'notice', kind: t.role ? 'gold' : 'err', text: t.role ? 'Ana Admin seni alt admin (moderatör) yaptı.' : 'Alt admin yetkin alındı.' });
        this.pushMe(t.name);
        return ok(t.name + (t.role ? ' alt admin yapıldı.' : ' yetkisi alındı.'));
      }
      default: return undefined;
    }
  };
};
};

        if (ch.err) return fail(ch.err);
        const text = clean(m.text, 140);
        if (!text) return undefined;
        const bad = gate(text, ch.gap);
        if (bad) return fail(bad);
        conn.chatT = now; conn.lastText = text; conn.lastTextAt = now;
        const msg = { t: 'chat', ch: m.ch, from: u.name, text, at: now, clan: u.clan, c: u.country, role: u.role || '', nc: u.nc || '' };
        let h = this.hist.get(ch.key);
        if (!h) this.hist.set(ch.key, h = []);
        h.push(msg); if (h.length > HIST_CAP) h.shift();
        const s = JSON.stringify(msg);
        for (const c of ch.conns()) {
          const r = c.user;
          if (!r) continue;
          if (c !== conn) {
            if (!visible(r, msg)) continue;
            if (m.ch !== 'room' && c.room && c.room.state === 'play') continue;   // maçtaki oyunculara metin gönderme
          }
          c.send(s);
        }
        this.m.chats++;
        return undefined;
      }
      case 'chat.hist': {
        const ch = this.chanTargets(conn, m.ch);
        if (ch.err) return fail(ch.err);
        const msgs = (this.hist.get(ch.key) || []).filter((x) => visible(u, x));
        return this.send(conn, { t: 'chat.hist', ch: m.ch, msgs });
      }

      // ---------- özel mesaj ----------
      case 'dm.send': {
        const t = st.getUser(clean(m.to, 16));
        if (!t || t === u || !t.card) return fail('Oyuncu bulunamadı.');
        const text = clean(m.text, 200);
        if (!text) return undefined;
        if (u.blocked.includes(t.name)) return fail('Önce bu oyuncunun engelini kaldırmalısın.');
        const bad = gate(text, CHAT_GAP);
        if (bad) return fail(bad);
        conn.chatT = now; conn.lastText = text; conn.lastTextAt = now;
        // karşı taraf seni engellediyse / susturduysa mesaj ona hiç gösterilmez (gönderen fark etmez)
        const hidden = t.blocked.includes(u.name) || t.muted.includes(u.name);
        const d = this.dmDoc(u.name, t.name);
        const msg = { f: u.name, x: text, at: now };
        if (hidden) msg.h = 1;
        d.msgs.push(msg); if (d.msgs.length > DM_CAP) d.msgs.shift();
        d.seen[key(u.name)] = now;
        this.dirty.add(d.id);
        this.send(conn, { t: 'dm', with: t.name, f: u.name, x: text, at: now });
        if (!hidden) this.sendTo(t.name, { t: 'dm', with: u.name, f: u.name, x: text, at: now, unread: this.dmUnread(t) });
        return undefined;
      }
      case 'dm.hist': {
        const t = st.getUser(clean(m.with, 16));
        if (!t || t === u) return fail('Oyuncu bulunamadı.');
        const d = this.store.docs('dm').get(dmId(u.name, t.name));
        const msgs = d ? d.msgs.filter((x) => !(x.h && x.f !== u.name)) : [];
        if (d) { d.seen[key(u.name)] = now; this.dirty.add(d.id); }
        this.send(conn, { t: 'dm.hist', with: t.name, msgs });
        return this.send(conn, { t: 'dm.unread', n: this.dmUnread(u) });
      }
      case 'dm.read': {
        const t = st.getUser(clean(m.with, 16));
        const d = t && this.store.docs('dm').get(dmId(u.name, t.name));
        if (d) { d.seen[key(u.name)] = now; this.dirty.add(d.id); }
        return this.send(conn, { t: 'dm.unread', n: this.dmUnread(u) });
      }
      case 'dm.inbox': {
        const k = key(u.name), docs = this.store.docs('dm'), list = [];
        for (const id of this.dmIdx.get(k) || []) {
          const d = docs.get(id);
          if (!d) continue;
          const ou = st.getUser(key(d.a) === k ? d.b : d.a);
          if (!ou || u.blocked.includes(ou.name)) continue;
          const seen = d.seen[k] || 0;
          let last = null, unread = 0;
          for (let i = d.msgs.length - 1; i >= 0; i--) {
            const x = d.msgs[i];
            if (x.h && x.f !== u.name) continue;
            if (!last) last = x;
            if (x.at > seen && x.f !== u.name) unread++;
          }
          if (last) list.push({ with: ou.name, row: this.playerRow(ou), last: { f: last.f, x: last.x, at: last.at }, unread });
        }
        list.sort((a, b) => b.last.at - a.last.at);
        return this.send(conn, { t: 'dm.inbox', list: list.slice(0, 30) });
      }

      // ---------- topluluklar ----------
      case 'com.create': {
        if (!u.card) return fail('Önce kartını oluştur.');
        const name = clean(m.name, 24);
        if (name.length < 3) return fail('Topluluk adı en az 3 karakter olmalı.');
        const map = this.comMap(), mine = this.comIdx.get(key(u.name)) || new Set();
        let owned = 0;
        for (const id of mine) { const c = map.get(id); if (c && c.owner === u.name) owned++; }
        if (owned >= MAX_OWNED) return fail('En fazla ' + MAX_OWNED + ' topluluk kurabilirsin.');
        if (mine.size >= MAX_JOINED) return fail('En fazla ' + MAX_JOINED + ' topluluğa üye olabilirsin.');
        for (const c of map.values()) if (key(c.name) === key(name)) return fail('Bu topluluk adı kullanılıyor.');
        if (!this.guard(conn, 'com:' + key(u.name), 6, 3600000)) return fail('Çok fazla topluluk kurdun, biraz bekle.');
        let id;
        do { id = randCode(6); } while (map.has(id));
        const c = { id, name, desc: clean(m.desc, 80), owner: u.name, open: m.open !== false, members: [u.name], created: now };
        st.putDoc('com', id, c); this.comIndex(c, id);
        this.pushMe(u.name);
        return this.send(conn, { t: 'com.joined', id, created: true });
      }
      case 'com.list': {
        const q = key(clean(m.q, 24)), mine = this.comIdx.get(key(u.name)) || new Set(), out = [];
        for (const c of this.comMap().values()) {
          if (!c.open || (q && !key(c.name).includes(q))) continue;
          out.push({ id: c.id, name: c.name, desc: c.desc, n: c.members.length, owner: c.owner, joined: mine.has(c.id) });
        }
        out.sort((a, b) => b.n - a.n || (a.name < b.name ? -1 : 1));
        return this.send(conn, { t: 'coms', list: out.slice(0, 30) });
      }
      case 'com.join': {      // açık topluluklara listeden, özel topluluklara davet koduyla (kod = id) katılınır
        const id = clean(m.id, 8).toUpperCase(), c = this.comMap().get(id);
        if (!c) return fail('Topluluk bulunamadı. Kodu kontrol et.');
        if (c.members.includes(u.name)) return fail('Zaten bu topluluktasın.');
        if (c.members.length >= MAX_COM_MEMBERS) return fail('Topluluk dolu.');
        if ((this.comIdx.get(key(u.name)) || new Set()).size >= MAX_JOINED) return fail('En fazla ' + MAX_JOINED + ' topluluğa üye olabilirsin.');
        c.members.push(u.name); st.putDoc('com', id, c); addIdx(this.comIdx, u.name, id);
        this.pushMe(u.name);
        return this.send(conn, { t: 'com.joined', id });
      }
      case 'com.leave': case 'com.delete': case 'com.kick': {
        const id = clean(m.id, 8).toUpperCase(), c = this.comMap().get(id);
        if (!c || !c.members.includes(u.name)) return fail('Bu topluluğun üyesi değilsin.');
        const owner = c.owner === u.name;
        const remove = (name) => { c.members = c.members.filter((x) => x !== name); delIdx(this.comIdx, name, id); };
        if (m.t === 'com.kick') {
          if (!owner) return fail('Sadece topluluk sahibi üye atabilir.');
          const t = st.getUser(clean(m.name, 16));
          if (!t || t === u || !c.members.includes(t.name)) return fail('Oyuncu bu toplulukta değil.');
          remove(t.name); st.putDoc('com', id, c);
          this.pushMe(t.name);
          return this.sendTo(t.name, { t: 'notice', kind: 'err', text: '"' + c.name + '" topluluğundan çıkarıldın.' });
        }
        if (m.t === 'com.delete') {
          if (!owner) return fail('Sadece topluluk sahibi silebilir.');
          const members = c.members.slice();
          for (const n of members) delIdx(this.comIdx, n, id);
          st.delDoc('com', id); this.hist.delete('com:' + id);
          for (const n of members) this.pushMe(n);
          return undefined;
        }
        remove(u.name);
        if (!c.members.length) { st.delDoc('com', id); this.hist.delete('com:' + id); } else {
          if (owner) c.owner = c.members[0];
          st.putDoc('com', id, c);
        }
        return this.pushMe(u.name);
      }
      case 'com.info': {
        const id = clean(m.id, 8).toUpperCase(), c = this.comMap().get(id);
        if (!c || !c.members.includes(u.name)) return fail('Bu topluluğun üyesi değilsin.');
        return this.send(conn, { t: 'com', com: { id, name: c.name, desc: c.desc, owner: c.owner, open: c.open, created: c.created,
          members: c.members.map((n) => ({ name: n, online: this.online.has(key(n)) })) } });
      }
      default: return undefined;
    }
  };

  // ---------- DM belgeleri ----------
  P.dmDoc = function (a, b) {
    const id = dmId(a, b), docs = this.store.docs('dm');
    let d = docs.get(id);
    if (!d) {
      d = { id, a, b, msgs: [], seen: {} };
      this.store.putDoc('dm', id, d);
      this.dmIndex(d, id);
    }
    return d;
  };

  P.dmUnread = function (u) {
    const k = key(u.name), ids = this.dmIdx.get(k);
    if (!ids || !ids.size) return 0;
    const docs = this.store.docs('dm');
    let n = 0;
    for (const id of ids) {
      const d = docs.get(id);
      if (!d) continue;
      const seen = d.seen[k] || 0;
      for (let i = d.msgs.length - 1; i >= 0; i--) {
        const x = d.msgs[i];
        if (x.at <= seen) break;
        if (x.f !== u.name && !x.h) n++;
      }
    }
    return n;
  };

  // değişen DM'leri depoya yaz (her mesajda değil, birkaç saniyede bir toplu)
  P.flushDocs = function () {
    if (!this.dirty.size) return;
    const docs = this.store.docs('dm');
    for (const id of this.dirty) { const d = docs.get(id); if (d) this.store.putDoc('dm', id, d); }
    this.dirty.clear();
  };
};

};
defs["src/server/clans.js"]=function(module,exports,require){
'use strict';
/* Klan sistemi: kurma, katılma, ayrılma, rütbe, atma, forma ve klan MMR'ı (klan savaşları için adil eşleşme).
   Roller: L = Lider, O = Subay, M = Üye. Klan sohbeti chat.js'te ('clan' kanalı). Hub.prototype'a eklenir. */
const { cardView } = require("src/core/cards.js");
const { KITS, STRIPES, LOGO_SHAPES, LOGO_COLORS, leagueOf, clamp } = require("src/core/consts.js");
const { key } = require("src/server/store.js");

const MAX_MEMBERS = 15;
const TAG_RE = /^[A-Za-z0-9]{2,4}$/;

module.exports = function install(Hub) {
  const P = Hub.prototype;
  const clean = (s, n) => (typeof s === 'string' ? s.replace(/[\u0000-\u001f\u007f<>]/g, '').replace(/\s+/g, ' ').trim().slice(0, n) : '');
  const kitOf = (kit, stripe) => ({
    kit: clamp(Math.floor(Number(kit)) || 0, 0, KITS.length - 1),
    stripe: clamp(Math.floor(Number(stripe)) || 0, 0, STRIPES.length - 1),
  });

  const logoOf = (l) => ({ s: clamp(Math.floor(Number(l && l.s)) || 0, 0, LOGO_SHAPES.length - 1), c: clamp(Math.floor(Number(l && l.c)) || 0, 0, LOGO_COLORS.length - 1) });

  // eski klan kayıtlarını yeni şemaya taşır (puan -> MMR, forma, savaş geçmişi, üye sınırı)
  P.migrateClan = function (c) {
    if (typeof c.mmr !== 'number') c.mmr = 1000 + Math.round((c.pts || 0) * 8);
    delete c.pts;
    c.kit = kitOf(c.kit && c.kit.kit, c.kit && c.kit.stripe);
    c.logo = logoOf(c.logo);
    if (!Array.isArray(c.hist)) c.hist = [];
    for (const k of ['w', 'd', 'l']) if (typeof c[k] !== 'number') c[k] = 0;
    return c;
  };

  P.clanBrief = function (tag) {
    const c = this.store.getClan(tag);
    if (!c) return null;
    return { tag: c.tag, name: c.name, mmr: c.mmr, league: leagueOf(c.mmr).id, n: c.members.length, max: MAX_MEMBERS, kit: c.kit, logo: c.logo };
  };

  P.roleOf = function (c, name) {
    const m = c.members.find((x) => key(x.n) === key(name));
    return m ? m.r : null;
  };

  P.clanRank = function (c) {
    let r = 1;
    for (const x of this.store.clans.values()) if (x.mmr > c.mmr) r++;
    return r;
  };

  // klanın aradığı savaş odası (varsa)
  P.warInfo = function (tag) {
    const r = this.warRooms.get(key(tag));
    return r ? { code: r.code, mode: r.mode, n: r.members.length } : null;
  };

  P.clanView = function (c) {
    const members = c.members.map((m) => {
      const u = this.store.getUser(m.n);
      const v = u && u.card ? cardView(u.name, u.card) : null;
      return { name: m.n, role: m.r, online: this.online.has(key(m.n)), ovr: v ? v.ovr : 0, pos: v ? v.pos : '', tier: v ? v.tier : 'bronz',
        mmr: u ? u.mmr : 0, lvl: u && u.card ? u.card.lvl : 0, country: u ? u.country : '', look: v ? v.look : null };
    });
    const rank = { L: 0, O: 1, M: 2 };
    members.sort((a, b) => rank[a.role] - rank[b.role] || b.ovr - a.ovr);
    return { tag: c.tag, name: c.name, leader: c.leader, mmr: c.mmr, league: leagueOf(c.mmr).id, w: c.w, d: c.d, l: c.l, created: c.created,
      kit: c.kit, logo: c.logo, hist: c.hist, max: MAX_MEMBERS, rank: this.clanRank(c), war: this.warInfo(c.tag), members };
  };

  // klan üyelerine mesaj (isteğe bağlı bir isim hariç)
  P.clanCast = function (c, obj, except) {
    const s = JSON.stringify(obj);
    for (const m of c.members) {
      const cn = this.online.get(key(m.n));
      if (cn && cn.user && key(cn.user.name) !== key(except || '')) cn.send(s);
    }
  };

  P.clanPresence = function (u) {
    if (!u.clan) return;
    const c = this.store.getClan(u.clan);
    if (c) this.clanCast(c, { t: 'clan.presence', name: u.name, online: this.online.has(key(u.name)) }, u.name);
  };

  P.clanMsg = function (conn, m) {
    const u = conn.user, st = this.store, now = this.now();
    const own = u.clan ? st.getClan(u.clan) : null;
    const fail = (msg) => this.err(conn, 'clan', msg);
    switch (m.t) {
      case 'clan.create': {
        if (!u.card) return fail('Önce kartını oluştur.');
        if (own) return fail('Zaten bir klandasın.');
        const name = clean(m.name, 20), tag = clean(m.tag, 4);
        if (name.length < 3) return fail('Klan adı en az 3 karakter olmalı.');
        if (!TAG_RE.test(tag)) return fail('Klan etiketi 2-4 harf/rakam olmalı.');
        const T = tag.toUpperCase();
        if (st.getClan(T)) return fail('Bu etiket kullanılıyor.');
        for (const c of st.clans.values()) if (key(c.name) === key(name)) return fail('Bu klan adı kullanılıyor.');
        const c = this.migrateClan({ tag: T, name, leader: u.name, members: [{ n: u.name, r: 'L', j: now }], mmr: 1000, w: 0, d: 0, l: 0, created: now,
          kit: kitOf(m.kit, m.stripe), logo: logoOf(m.logo) });
        u.clan = T; st.putClan(c); st.putUser(u); this.lbCache = null;
        this.send(conn, { t: 'me', me: this.meView(u) });
        return this.send(conn, { t: 'clan', clan: this.clanView(c) });
      }
      case 'clan.join': {
        if (own) return fail('Zaten bir klandasın.');
        if (!u.card) return fail('Önce kartını oluştur.');
        const c = st.getClan(clean(m.tag, 4));
        if (!c) return fail('Klan bulunamadı.');
        if (c.members.length >= MAX_MEMBERS) return fail('Klan dolu (' + MAX_MEMBERS + ').');
        c.members.push({ n: u.name, r: 'M', j: now });
        u.clan = c.tag; st.putClan(c); st.putUser(u); this.lbCache = null;
        this.clanCast(c, { t: 'clan.event', text: u.name + ' klana katıldı.' }, u.name);
        this.send(conn, { t: 'me', me: this.meView(u) });
        this.clanCast(c, { t: 'clan', clan: this.clanView(c) }, u.name);
        return this.send(conn, { t: 'clan', clan: this.clanView(c) });
      }
      case 'clan.leave': {
        if (!own) return fail('Bir klanda değilsin.');
        if (conn.room && conn.room.kind === 'clan') return fail('Klan odasındayken ayrılamazsın.');
        this.removeFromClan(own, u.name);
        this.send(conn, { t: 'me', me: this.meView(u) });
        return this.send(conn, { t: 'clan', clan: null });
      }
      case 'clan.info': {
        const c = m.tag ? st.getClan(clean(m.tag, 4)) : own;
        if (!c) return this.send(conn, { t: 'clan', clan: null });
        return this.send(conn, { t: 'clan', clan: this.clanView(c), mine: !!own && own.tag === c.tag });
      }
      case 'clan.list': {
        const q = key(clean(m.q, 20));
        const out = [];
        for (const c of st.clans.values()) {
          if (q && !key(c.tag).startsWith(q) && !key(c.name).includes(q)) continue;
          out.push({ tag: c.tag, name: c.name, mmr: c.mmr, league: leagueOf(c.mmr).id, n: c.members.length, max: MAX_MEMBERS, leader: c.leader,
            full: c.members.length >= MAX_MEMBERS, kit: c.kit, logo: c.logo, w: c.w, d: c.d, l: c.l });
        }
        out.sort((a, b) => b.mmr - a.mmr || b.n - a.n);
        return this.send(conn, { t: 'clans', list: out.slice(0, 30) });
      }
      case 'clan.kit': {
        if (!own) return fail('Bir klanda değilsin.');
        if (this.roleOf(own, u.name) === 'M') return fail('Formayı lider veya subay değiştirebilir.');
        own.kit = kitOf(m.kit, m.stripe);
        st.putClan(own); this.lbCache = null;
        this.clanCast(own, { t: 'clan.event', text: u.name + ' klan formasını değiştirdi.' });
        return this.clanCast(own, { t: 'clan', clan: this.clanView(own) });
      }
      case 'clan.logo': {
        if (!own) return fail('Bir klanda değilsin.');
        if (this.roleOf(own, u.name) === 'M') return fail('Logoyu lider veya subay değiştirebilir.');
        own.logo = logoOf(m.logo);
        st.putClan(own); this.lbCache = null;
        this.clanCast(own, { t: 'clan.event', text: u.name + ' klan logosunu değiştirdi.' });
        return this.clanCast(own, { t: 'clan', clan: this.clanView(own) });
      }
      case 'clan.kick': case 'clan.promote': case 'clan.demote': case 'clan.lead': {
        if (!own) return fail('Bir klanda değilsin.');
        const me = this.roleOf(own, u.name), tn = clean(m.name, 16);
        const tr = this.roleOf(own, tn);
        if (!tr) return fail('Oyuncu bu klanda değil.');
        if (key(tn) === key(u.name)) return fail('Bu işlemi kendine yapamazsın.');
        const tu = st.getUser(tn);
        if (m.t === 'clan.kick') {
          if (me === 'M' || (me === 'O' && tr !== 'M')) return fail('Bunun için yetkin yok.');
          const rm = this.userRoom.get(key(tn));
          if (rm && rm.kind === 'clan') return fail('Oyuncu klan odasında.');
          this.removeFromClan(own, tn);
          this.clanCast(own, { t: 'clan.event', text: tn + ' klandan atıldı.' });
          this.pushMe(tn);
        } else {
          if (me !== 'L') return fail('Sadece lider yapabilir.');
          const mem = own.members.find((x) => key(x.n) === key(tn));
          if (m.t === 'clan.promote') { if (mem.r !== 'M') return fail('Zaten subay.'); mem.r = 'O'; }
          else if (m.t === 'clan.demote') { if (mem.r !== 'O') return fail('Subay değil.'); mem.r = 'M'; }
          else {
            mem.r = 'L'; own.leader = tu.name;
            own.members.find((x) => key(x.n) === key(u.name)).r = 'O';
          }
          st.putClan(own);
          this.clanCast(own, { t: 'clan.event', text: tn + ' artık ' + ({ O: 'subay', M: 'üye', L: 'lider' }[mem.r]) + '.' });
        }
        return this.clanCast(own, { t: 'clan', clan: this.clanView(own) });
      }
      default: return undefined;
    }
  };

  // üyeyi çıkar; lider çıkarsa liderlik devredilir, klan boşalırsa silinir
  P.removeFromClan = function (c, name) {
    const st = this.store, k = key(name);
    c.members = c.members.filter((x) => key(x.n) !== k);
    const u = st.getUser(name);
    if (u) { u.clan = null; st.putUser(u); }
    if (!c.members.length) {
      st.delClan(c.tag); this.lbCache = null;
      this.hist.delete('k:' + c.tag);
      return;
    }
    if (key(c.leader) === k) {
      const next = c.members.find((x) => x.r === 'O') || c.members.slice().sort((a, b) => a.j - b.j)[0];
      next.r = 'L'; c.leader = next.n;
      this.clanCast(c, { t: 'clan.event', text: next.n + ' yeni lider oldu.' });
      this.pushMe(next.n);
    }
    st.putClan(c); this.lbCache = null;
    this.clanCast(c, { t: 'clan', clan: this.clanView(c) });
  };
};

};
defs["src/server/hub.js"]=function(module,exports,require){
'use strict';
/* Hub: oyunun tüm sunucu mantığı. Taşımadan bağımsızdır:
   - sunucuda WebSocket bağlantılarıyla,
   - tarayıcıdaki çevrimdışı demoda yerel bağlantılarla aynı kod çalışır.

   Modüller: clans.js (klan, klan MMR), rooms.js (odalar, eşleştirme, lobi, maç sonu),
   social.js (arkadaş, engel, şikayet, profil, pazar, gelişim), chat.js (kanallar, DM, topluluk). */

const { decodeInput } = require("src/core/proto.js");

const NAME_RE = /^[A-Za-z0-9ğüşıöçĞÜŞİÖÇ_.\-]{3,16}$/;
const MAX_TEXT = 4096;
const STAT_KEYS = ['m', 'w', 'd', 'l', 'g', 'a', 's', 'cs', 'cm', 'sm', 'rm'];
const SOCIAL = new Set(['social', 'profile', 'market', 'friend.add', 'friend.accept', 'friend.decline', 'friend.remove',

class Hub {
  constructor(env) {

    this.conns = new Set();

    this.rooms = new Map();           // kod -> oda

    this.userRoom = new Map();        // key(isim) -> oda (yeniden bağlanma için)
    this.queues = {};                 // 'quick5' / 'rank3' ... -> bekleyenler (2v2 ... 11v11, tembel oluşturulur)
    this.warQ = {};     // rakip klan arayan klan odaları
    this.warRooms = new Map();        // key(klan etiketi) -> aranan oda

    if (!s.sm && !s.cm && s.m) s.sm = s.m;       // eski kayıtlar: maçların hepsi "tek başına" sayılır
    for (const k of ['friends', 'freq', 'blocked', 'muted']) if (!Array.isArray(u[k])) u[k] = [];
    if (typeof u.chatBan !== 'number') u.chatBan = 0;
    if (typeof u.gold !== 'number') u.gold = 0;
    if (typeof u.gems !== 'number') u.gems = 0;
    if (!Array.isArray(u.inv)) u.inv = [];
    if (!Array.isArray(u.codes)) u.codes = [];
    if (!u.eq || typeof u.eq !== 'object') u.eq = {};
    if (typeof u.muteUntil !== 'number') u.muteUntil = 0;
    if (typeof u.banUntil !== 'number') u.banUntil = 0;
    if (u.role !== 'owner' && u.role !== 'mod') u.role = '';
    if (typeof u.nc !== 'string') u.nc = '';
    if (u.card) {

  connect(conn) {

      case 'login': return void this.loginMsg(conn, m);
      case 'resume': return this.resume(conn, m);

      case 'look': return this.setLook(conn, m);
      case 'me': return this.send(conn, { t: 'me', me: this.meView(u) });
      case 'lb': return this.send(conn, Object.assign({ t: 'lb' }, this.leaderboard()));
      case 'logout': return this.logout(conn);
      default: break;

    if (m.t.startsWith('admin.')) return this.adminMsg(conn, m);
    if (SOCIAL.has(m.t)) return this.socialMsg(conn, m);
    if (m.t.startsWith('chat.') || m.t.startsWith('dm.') || m.t.startsWith('com.')) return this.chatMsg(conn, m);
    if (m.t.startsWith('clan.war')) return this.roomMsg(conn, m);
    if (m.t.startsWith('clan.')) return this.clanMsg(conn, m);
    if (m.t.startsWith('room.') || m.t.startsWith('lobby.') || m.t === 'queue' || m.t === 'unqueue' || m.t === 'practice' || m.t === 'invite' || m.t === 'emote') return this.roomMsg(conn, m);

  onBin(conn, u8) {

        country: COUNTRY_BY[m.country] ? m.country : 'TR', stats: {}, clan: null });
      this.store.putUser(u);
      this.m.regs++;

      this.login(conn, u);
    } finally { this.pendingNames.delete(k); }

  // aynı hedefe art arda başarısız/aşırı deneme sınırı: limit kadar hak, pencere süresi boyunca

    const fk = 'l:' + key(name);
    const f = this.fails.get(fk);
    if (f && f.until > this.now() && f.n >= 6) return this.err(conn, 'rate', 'Çok fazla hatalı deneme. 1 dakika sonra tekrar dene.');
    const u = this.store.getUser(name);
    const ok = u ? await this.env.verifyPw(pw, u.pw) : (await this.env.hashPw(pw), false);   // zamanlama farkını gizle
    if (!this.conns.has(conn)) return;
    if (!ok) { this.guard(conn, fk, 5, 60000); return this.err(conn, 'bad_login', 'Kullanıcı adı veya şifre hatalı.'); }
    this.fails.delete(fk);
    this.login(conn, u);
  }

  resume(conn, m) {
    if (conn.user) return;

    this.login(conn, u);
  }

  login(conn, u) {
    const old = this.online.get(key(u.name));
    if (old && old !== conn) {
      this.send(old, { t: 'kicked', msg: 'Hesabına başka yerden giriş yapıldı.' });
      old.close(4000, 'başka yerden giriş');
      this.disconnect(old);

    conn.user = u; this.online.set(key(u.name), conn);
    this.send(conn, { t: 'auth', token: u.token, me: this.meView(u), online: this.online.size });
    this.clanPresence(u);
    this.onLoginRoom(conn);
  }

  meView(u) {
    const lg = leagueOf(u.mmr);
    return {
      name: u.name, mmr: u.mmr, league: lg.id, country: u.country, stats: u.stats, created: u.created,
      gold: u.gold, gems: u.gems, inv: u.inv, eq: u.eq, role: u.role, nc: u.nc, codes: u.codes,
      mute: this.muteLeft(u, this.now()), ban: this.banLeft(u, this.now()),
      card: u.card ? Object.assign(cardView(u.name, u.card), { pts: u.card.pts, claimed: u.card.claimed, style: u.card.style, claimable: claimable(u.card).length }) : null,
      clan: u.clan ? this.clanBrief(u.clan) : null,
      friends: u.friends, freq: u.freq, blocked: u.blocked, muted: u.muted,
      coms: this.userComs(u), unread: this.dmUnread(u),
    };
  }

  createCard(conn, m) {
    const u = conn.user;
    if (u.card) return this.err(conn, 'state', 'Kartın zaten oluşturulmuş.');
    if (!POSITIONS.includes(m.pos)) return this.err(conn, 'bad_pos', 'Geçersiz mevki.');
    if (!STYLES[m.style]) return this.err(conn, 'bad_style', 'Geçersiz oyun stili.');
    if (COUNTRY_BY[m.country]) u.country = m.country;
    u.card = makeCard(u.name, m.pos, m.style, m.look);
    this.store.putUser(u);
    this.lbCache = null; this.mkCache = null;
    this.send(conn, { t: 'me', me: this.meView(u), created: true });
  }

  setLook(conn, m) {
    const u = conn.user;
    if (!u.card) return;
    u.card.look = sanitizeLook(m.look, u.card.lvl, u.inv);
    this.store.putUser(u);
    this.mkCache = null;
    this.send(conn, { t: 'me', me: this.meView(u) });
  }

  // ---------- sıralama (5 sn önbellek) ----------
  leaderboard() {
    const t = this.now();
    if (this.lbCache && t - this.lbAt < 5000) return this.lbCache;
    const players = [];
    for (const u of this.store.users.values()) {
      if (!u.card) continue;
      const v = cardView(u.name, u.card);
      players.push({ name: u.name, mmr: u.mmr, league: leagueOf(u.mmr).id, ovr: v.ovr, pos: v.pos, tier: v.tier, lvl: u.card.lvl, clan: u.clan, w: u.stats.w, m: u.stats.m, country: u.country, look: v.look });
    }
    players.sort((a, b) => b.mmr - a.mmr || b.ovr - a.ovr);
    const clans = [];
    for (const c of this.store.clans.values()) clans.push({ tag: c.tag, name: c.name, mmr: c.mmr, league: leagueOf(c.mmr).id, n: c.members.length, w: c.w, d: c.d, l: c.l, kit: c.kit, logo: c.logo });
    clans.sort((a, b) => b.mmr - a.mmr || b.n - a.n);
    this.lbAt = t;
    return (this.lbCache = { players: players.slice(0, 50), clans: clans.slice(0, 30) });
  }

  // kapanış: bekleyen belgeleri (DM'ler) ve depoyu diske yaz
  shutdown() { this.flushDocs(); this.store.flushSync(); }

  metrics() {
    let inMatch = 0, queued = 0, rooms = 0, lobbyUsers = 0;
    for (const r of this.playing) inMatch += r.members.filter((x) => x.conn).length;
    for (const q of Object.values(this.queues)) queued += q.length;

      inMatch, queued, warSearching: Object.values(this.warQ).reduce((a, q) => a + q.length, 0),
      users: this.store.users.size, clans: this.store.clans.size, communities: this.store.docs('com').size,
    }, this.m);
  }
}

    for (let i = 1; i <= LOBBY_COUNT; i++) {
      const r = this.rooms.get('L' + i);
      if (r) out.push({ code: r.code, name: r.name, mode: r.mode, n: r.members.filter((x) => !x.left).length, max: r.mode * 2, state: r.state, seconds: r.seconds, host: r.host, specs: r.specs.length, maxSpec: MAX_SPEC });
    }
    return out;
  };

  P.resetLobby = function (room) {
    room.members = []; room.specs = []; room.invited = new Set(); room.bots = true; room.host = ''; room.state = 'lobby'; room.sim = null; room.roster = null; room.goalsSeen = 0;
    room.clans = [null, null]; room.war = false; room.searching = false; room.autoAt = 0; room.emptySince = 0;
    room.seconds = this.env.matchSeconds || 180; room.active = this.now();
  };

  P.untrackWar = function (room) {
    const k = room.clans[0] && key(room.clans[0]);
    if (k && this.warRooms.get(k) === room) this.warRooms.delete(k);
  };

  P.destroyRoom = function (room) {
    this.untrackWar(room);
    this.playing.delete(room);
    for (const m of room.members) {
      if (this.userRoom.get(key(m.user.name)) === room) this.userRoom.delete(key(m.user.name));
      if (m.conn && m.conn.room === room) { m.conn.room = null; m.conn.member = null; m.conn.pi = -1; }
    }
    for (const c of room.specs) { if (c.room === room) { c.room = null; c.spec = false; this.send(c, { t: 'room', room: null }); } }
    room.specs = [];
    this.hist.delete('r:' + room.code);
    if (room.persist) this.resetLobby(room);
    else this.rooms.delete(room.code);
  };

  // ---------- istemci mesajları ----------
  P.roomMsg = function (conn, m) {
    const u = conn.user;
    const fail = (msg) => this.err(conn, 'room', msg);
    if (m.t === 'room.leave') return this.leaveRoom(conn, true);
    if (m.t === 'unqueue') { this.dropQueue(conn); return this.send(conn, { t: 'queue', mode: 0 }); }
    if (m.t === 'lobby.list') return this.send(conn, { t: 'lobbies', list: this.lobbyList() });
    if (!u.card) return fail('Önce kartını oluştur.');
    const mode = clampMode(m.mode);
    if (['queue', 'practice', 'room.create', 'room.join', 'room.spec', 'clan.war'].includes(m.t)) {
      const bl = this.banLeft(u, this.now());
      if (bl) return fail(bl < 0 ? 'Oyundan kalıcı olarak yasaklandın: odalara giremez ve maç oynayamazsın.' : 'Yasaklısın: odalara giremez ve maç oynayamazsın (' + this.fmtLeft(bl) + ' kaldı).');
    }
    switch (m.t) {
      case 'queue': {
        if (conn.room) return fail('Zaten bir odadasın.');
        this.dropQueue(conn);
        const kind = m.rank ? 'rank' : 'quick';
        this.getQueue(kind, mode).push({ conn, user: u, since: this.now(), mode, kind });
        conn.queued = kind + mode;
        return this.queueStatus(kind, mode);
      }
      case 'practice': {
        if (conn.room) return fail('Zaten bir odadasın.');
        this.dropQueue(conn);
        const room = this.makeRoom('practice', mode);
        this.addMember(room, conn, 0);
        return this.launch(room);
      }
      case 'room.create': {
        if (conn.room) return fail('Zaten bir odadasın.');
        const clan = !!m.clan, rr = !!m.rank && !clan;
        if (clan && !u.clan) return fail('Klan maçı için bir klanda olmalısın.');
        this.dropQueue(conn);
        const room = this.makeRoom(clan ? 'clan' : rr ? 'rankroom' : 'custom', mode);
        if (!clan && !rr) room.bots = m.bots !== false;
        if (TIMES.includes(m.seconds)) room.seconds = m.seconds;
        if (clan) room.clans[0] = u.clan;
        this.addMember(room, conn, 0);
        return this.roomCast(room);
      }
      case 'room.join': {
        const room = this.rooms.get(cleanCode(m.code));
        if (!room || !ROOM_KINDS.includes(room.kind)) return fail('Oda bulunamadı.');
        if (conn.room === room) return this.roomCast(room);
        if (conn.room) return fail('Zaten bir odadasın.');
        if (room.kind === 'rankroom' && !room.invited.has(key(u.name))) return fail('Bu Rank odasına yalnızca davetle girilebilir.');
        if (room.state !== 'lobby') return fail('Bu odada maç sürüyor.');
        let team;
        if (room.kind === 'clan') {
          if (!u.clan) return fail('Bu bir klan odası; klanda olmalısın.');
          if (room.searching && u.clan !== room.clans[0]) return fail('Bu oda rakip klan arıyor; sadece kendi klanının üyeleri katılabilir.');
          if (u.clan === room.clans[0]) team = 0;
          else if (!room.clans[1] || u.clan === room.clans[1]) team = 1;
          else return fail('Bu odada zaten iki klan var.');
          if (countTeam(room, team) >= room.mode) return fail('Takımın dolu.');
          if (team === 1) room.clans[1] = u.clan;
        } else {
          team = countTeam(room, 0) <= countTeam(room, 1) ? 0 : 1;
          if (countTeam(room, team) >= room.mode) return fail('Oda dolu.');
        }
        this.dropQueue(conn);
        this.addMember(room, conn, team);
        return this.roomCast(room);
      }
      case 'room.team': {
        const room = conn.room;
        if (!room || !conn.member || room.state !== 'lobby' || room.kind === 'clan') return fail('Takım değiştirilemez.');
        const to = 1 - conn.member.team;
        if (countTeam(room, to) >= room.mode) return fail('Diğer takım dolu.');
        conn.member.team = to;
        return this.roomCast(room);
      }
      case 'room.time': {
        const room = conn.room;
        if (!room || room.state !== 'lobby' || room.host !== u.name) return fail('Sadece oda sahibi değiştirebilir.');
        if (TIMES.includes(m.seconds)) room.seconds = m.seconds;
        return this.roomCast(room);
      }
      case 'room.bots': {
        const room = conn.room;
        if (!room || room.state !== 'lobby' || room.host !== u.name) return fail('Sadece oda sahibi değiştirebilir.');
        if (room.kind === 'rankroom') return fail('Rank odalarında bot olmaz.');
        room.bots = !!m.on;
        return this.roomCast(room);
      }
      case 'room.spec': {      // izleyici olarak katıl (en fazla 4)
        const room = this.rooms.get(cleanCode(m.code));
        if (!room || !ROOM_KINDS.includes(room.kind)) return fail('Oda bulunamadı.');
        if (conn.room) return fail('Zaten bir odadasın.');
        if (room.kind === 'rankroom' && !room.invited.has(key(u.name))) return fail('Bu Rank odasına yalnızca davetle girilebilir.');
        if (room.specs.length >= MAX_SPEC) return fail('İzleyici sınırı (' + MAX_SPEC + ') dolu.');
        this.dropQueue(conn);
        room.specs.push(conn); conn.room = room; conn.member = null; conn.pi = -1; conn.spec = true; room.active = this.now();
        if (room.state === 'play' && room.sim) this.send(conn, this.startMsg(room, { pi: -1 }, u));
        return this.roomCast(room);
      }
      case 'invite': {
        const room = conn.room, t = this.store.getUser(String(m.name || '').slice(0, 16));
        if (!room || !conn.member || !ROOM_KINDS.includes(room.kind)) return fail('Davet göndermek için önce bir odada olmalısın.');
        if (room.state !== 'lobby') return fail('Maç sürerken davet gönderilemez.');
        if (!t || t === u || !this.online.has(key(t.name))) return fail('Oyuncu çevrimiçi değil.');
        if (t.blocked.includes(u.name) || u.blocked.includes(t.name)) return fail('Bu oyuncuya davet gönderilemiyor.');
        if (!this.guard(conn, 'inv:' + key(u.name), 30, 60000)) return fail('Çok fazla davet gönderdin, biraz bekle.');
        if (room.kind === 'rankroom') room.invited.add(key(t.name));
        this.sendTo(t.name, { t: 'invite', from: u.name, code: room.code, kind: room.kind, mode: room.mode });
        return this.send(conn, { t: 'notice', kind: 'ok', text: t.name + ' oyuncusuna davet gönderildi.' });
      }
      case 'emote': {
        const room = conn.room, e = Math.floor(Number(m.e));
        if (!room || room.state !== 'play' || conn.pi < 0) return undefined;
        if (!(FREE_EMOJIS.includes(e) || u.inv.includes('emo' + e))) return fail('Bu emojiye sahip değilsin.');
        const t = this.now();
        if (t - (conn.emoteT || 0) < 1500) return undefined;
        conn.emoteT = t;
        const s = JSON.stringify({ t: 'emote', i: conn.pi, e });
        for (const x of room.members) if (x.conn && !x.left) x.conn.send(s);
        for (const c of room.specs) c.send(s);
        return undefined;
      }
      case 'room.start': {
        const room = conn.room;
        if (!room || room.state !== 'lobby' || room.host !== u.name) return fail('Sadece oda sahibi başlatabilir.');
        if (room.kind === 'rankroom' || (!room.bots && room.kind !== 'clan')) {
          const a = countTeam(room, 0), b = countTeam(room, 1);
          if (a !== b || a < 2) return fail('Botsuz maç için iki takımda eşit sayıda (en az 2) oyuncu olmalı.');
        }
        if (room.searching) return fail('Rakip klan aranıyor. Aramayı durdurursan dostluk odasına dönüşür.');
        if (room.kind === 'clan' && (!countTeam(room, 0) || !countTeam(room, 1))) return fail('Rakip klan bekleniyor.');
        room.autoAt = 0;
        return this.launch(room);
      }
      case 'clan.war': {       // klan savaşı: rakip klan ara (lider / subay)
        const c = u.clan && this.store.getClan(u.clan);
        if (!c) return fail('Klan savaşı için bir klanda olmalısın.');
        if (this.roleOf(c, u.name) === 'M') return fail('Rakip aramayı lider veya subay başlatabilir.');
        if (conn.room) return fail('Zaten bir odadasın.');
        if (this.warRooms.has(key(c.tag))) return fail('Klanın zaten rakip arıyor; Klan sekmesinden katıl.');
        this.dropQueue(conn);
        const room = this.makeRoom('clan', mode);
        room.war = true; room.searching = true; room.searchSince = this.now(); room.clans[0] = c.tag;
        this.addMember(room, conn, 0);
        (this.warQ[mode] || (this.warQ[mode] = [])).push(room); this.warRooms.set(key(c.tag), room);
        this.clanCast(c, { t: 'clan', clan: this.clanView(c) });
        this.clanCast(c, { t: 'clan.event', text: u.name + ' rakip klan arıyor (' + mode + 'v' + mode + '). Katılmak için Klan sekmesine bak.' }, u.name);
        return this.roomCast(room);
      }
      case 'clan.war.cancel': {
        const room = conn.room;
        if (!room || !room.searching) return fail('Aktif bir rakip aramanız yok.');
        const c = room.clans[0] && this.store.getClan(room.clans[0]);
        if (!c || this.roleOf(c, u.name) === 'M') return fail('Aramayı lider veya subay durdurabilir.');
        this.stopWar(room);
        return this.roomCast(room);
      }
      default: return undefined;
    }
  };

  // klan savaşı aramasını bırak: oda dostluk odası olarak kalır
  P.stopWar = function (room) {
    room.searching = false; room.war = false;
    const c = room.clans[0] && this.store.getClan(room.clans[0]);
    this.untrackWar(room);
    if (c) this.clanCast(c, { t: 'clan', clan: this.clanView(c) });
  };

  P.leaveRoom = function (conn, explicit) {
    const room = conn.room, mem = conn.member;
    if (room && conn.spec) {                    // izleyici
      const i = room.specs.indexOf(conn);
      if (i >= 0) room.specs.splice(i, 1);
      conn.room = null; conn.spec = false;
      if (explicit) this.send(conn, { t: 'room', room: null });
      if (room.members.length) this.roomCast(room);
      return;
    }
    if (!room || !mem) return;
    const k = key(conn.user.name);
    conn.room = null; conn.member = null; conn.pi = -1;
    if (room.state === 'play') {
      mem.left = true; mem.conn = null;
      if (room.sim && mem.pi >= 0) room.sim.makeBot(mem.pi);
      if (explicit) this.userRoom.delete(k);          // bağlantı kopması ise geri dönüş hakkı kalır
      if (!room.members.some((x) => x.conn && !x.left)) {
        // bağlı insan kalmadı: geri dönebilecek biri varsa 60 sn bekle, yoksa odayı hemen kapat
        if (room.members.some((x) => this.userRoom.get(key(x.user.name)) === room)) room.emptySince = this.now();
        else this.destroyRoom(room);
      }
      if (explicit) this.send(conn, { t: 'room', room: null });
      return;
    }
    room.members = room.members.filter((x) => x !== mem);
    this.userRoom.delete(k);
    if (explicit) this.send(conn, { t: 'room', room: null });
    this.afterRoomChange(room);
  };

  // lobi: boşsa sil/sıfırla, sahip değiştiyse devret, klan odalarında taraf klanlarını güncelle
  P.afterRoomChange = function (room) {
    if (!room.members.length) { this.destroyRoom(room); return; }
    if (!room.members.some((x) => x.user.name === room.host)) room.host = room.members[0].user.name;
    if (room.kind === 'clan') {
      if (!countTeam(room, 1)) room.clans[1] = null;
      if (!countTeam(room, 0)) {              // ev sahibi klan boşaldı: taraflar yer değiştirir
        for (const x of room.members) x.team = 0;
        room.clans = [room.clans[1], null];
      }
      if (room.autoAt && (!countTeam(room, 0) || !countTeam(room, 1))) { room.autoAt = 0; room.war = false; }   // eşleşen taraf dağıldı
    }
    room.active = this.now();
    this.roomCast(room);
  };

  P.onLeaveConn = function (conn) { if (conn.room) this.leaveRoom(conn, false); };

  // giriş yapınca süren maça geri dön
  P.onLoginRoom = function (conn) {
    const room = this.userRoom.get(key(conn.user.name));
    if (!room || room.state !== 'play') return;
    const mem = room.members.find((x) => x.user === conn.user || key(x.user.name) === key(conn.user.name));
    if (!mem || !mem.left) return;
    mem.left = false; mem.conn = conn; mem.user = conn.user; room.emptySince = 0;
    conn.room = room; conn.member = mem; conn.pi = mem.pi;
    room.sim.makeHuman(mem.pi);
    this.send(conn, this.startMsg(room, mem));
  };

  // ---------- eşleştirme ----------
  P.getQueue = function (kind, mode) { const k = kind + mode; return this.queues[k] || (this.queues[k] = []); };
  const QRE = /^(quick|rank)(\d+)$/;

  P.dropQueue = function (conn) {
    if (!conn.queued) return;
    const k = conn.queued, q = this.queues[k];
    conn.queued = '';
    if (!q) return;
    const i = q.findIndex((e) => e.conn === conn);
    if (i >= 0) q.splice(i, 1);
    const mm = QRE.exec(k);
    if (mm) this.queueStatus(mm[1], +mm[2]);
  };

  // rank kuyruğunda MMR farkı penceresi: bekledikçe genişler (her 5 sn'de +75)
  P.rankWindow = function (waitMs) { return (this.env.rankWindow || RANK_WINDOW) + 75 * Math.floor(waitMs / 5000); };

  P.queueStatus = function (kind, mode) {
    const q = this.getQueue(kind, mode), t = this.now();
    const soloMs = this.env.queueSoloMs || QUEUE_SOLO_MS;
    for (const e of q) {
      this.send(e.conn, { t: 'queue', kind, mode, waiting: q.length, need: mode * 2, min: kind === 'rank' ? 4 : 2, secs: Math.floor((t - e.since) / 1000), soloAt: Math.floor(soloMs / 1000),
        mmr: e.user.mmr, win: kind === 'rank' ? this.rankWindow(t - e.since) : 0 });
    }
  };

  // eff: takım başına gerçek oyuncu sayısı (rank'ta kuyruk dolmasa da botsuz, eşit takımlarla başlar)
  P.formQueue = function (kind, mode, take, eff) {
    const q = this.getQueue(kind, mode);
    for (const e of take) { const i = q.indexOf(e); if (i >= 0) q.splice(i, 1); e.conn.queued = ''; }
    take.sort((a, b) => b.user.mmr - a.user.mmr);                 // yılan dağılımı: iki takımın MMR toplamı dengeli
    const room = this.makeRoom(kind, eff || mode);
    room.bots = kind !== 'rank';
    take.forEach((e, i) => this.addMember(room, e.conn, [0, 1, 1, 0][i % 4]));
    this.launch(room);
  };

  P.matchQueue = function (kind, mode, t) {
    const q = this.getQueue(kind, mode);
    for (let i = q.length - 1; i >= 0; i--) if (!this.conns.has(q[i].conn)) q.splice(i, 1);
    const pairMs = this.env.queuePairMs || QUEUE_PAIR_MS, soloMs = this.env.queueSoloMs || QUEUE_SOLO_MS, need = mode * 2;
    for (let g = 0; g < 6 && q.length; g++) {
      const anchor = q[0], wait = t - anchor.since;
      if (kind === 'quick') {
        const take = q.slice(0, need);
        if (take.length >= need || (take.length >= 2 && wait >= pairMs) || wait >= soloMs) this.formQueue(kind, mode, take, mode);
        else { this.queueStatus(kind, mode); break; }
        continue;
      }
      // rank: BOT YOK. MMR penceresindeki en yakın oyuncular; kuyruk dolmazsa bir süre sonra eşit takımlarla (en az 2v2) başlar
      const win = this.rankWindow(wait);
      let take = q.filter((e) => Math.abs(e.user.mmr - anchor.user.mmr) <= win)
        .sort((a, b) => Math.abs(a.user.mmr - anchor.user.mmr) - Math.abs(b.user.mmr - anchor.user.mmr)).slice(0, need);
      const k = Math.min(mode, Math.floor(take.length / 2));
      if (take.length >= need) this.formQueue(kind, mode, take, mode);
      else if (k >= 2 && wait >= pairMs) { take = take.slice(0, k * 2); this.formQueue(kind, mode, take, k); }
      else { this.queueStatus(kind, mode); break; }
    }
  };

  // klan savaşı: aranan klan odalarını klan MMR'ı yakınlığına (ve oyuncu sayısına) göre eşleştir
  P.matchWars = function (t) {
    const botMs = this.env.warBotMs || WAR_BOT_MS;
    for (const mode of Object.keys(this.warQ)) {
      const q = this.warQ[mode] = this.warQ[mode].filter((r) => r.searching && this.rooms.get(r.code) === r && r.members.length);
      for (let i = 0; i < q.length; i++) {
        const A = q[i];
        if (!A.searching) continue;
        for (let j = i + 1; j < q.length; j++) {
          const B = q[j];
          if (!B.searching) continue;
          const ca = this.store.getClan(A.clans[0]), cb = this.store.getClan(B.clans[0]);
          if (!ca || !cb || ca === cb) continue;
          const wait = Math.max(t - A.searchSince, t - B.searchSince);
          const win = WAR_WINDOW + 50 * Math.floor(wait / 5000);
          const diff = Math.abs(ca.mmr - cb.mmr) + 60 * Math.abs(A.members.length - B.members.length);
          if (diff <= win) { this.warMerge(A, B); break; }
        }
      }
      for (const A of q) if (A.searching && t - A.searchSince >= botMs) this.warBot(A);
      this.warQ[mode] = this.warQ[mode].filter((r) => r.searching);
    }
  };

  // iki aranan oda birleşir: B'nin üyeleri A'nın 2. takımı olur, kısa geri sayımdan sonra maç otomatik başlar
  P.warMerge = function (A, B) {
    const now = this.now();
    for (const mem of B.members) {
      mem.team = 1; A.members.push(mem);
      if (mem.conn) { mem.conn.room = A; mem.conn.member = mem; }
      this.userRoom.set(key(mem.user.name), A);
    }
    B.members = []; this.rooms.delete(B.code); this.hist.delete('r:' + B.code);
    A.clans[1] = B.clans[0];
    A.searching = false; B.searching = false;
    A.autoAt = now + (this.env.warAutoMs || WAR_AUTO_MS); A.active = now;
    this.warRooms.delete(key(A.clans[0])); this.warRooms.delete(key(B.clans[0]));
    const ca = this.store.getClan(A.clans[0]), cb = this.store.getClan(B.clans[0]);
    if (ca && cb) {
      this.clanCast(ca, { t: 'clan.event', text: 'Rakip bulundu: [' + cb.tag + '] ' + cb.name + ' (' + cb.mmr + ' MMR).' });
      this.clanCast(cb, { t: 'clan.event', text: 'Rakip bulundu: [' + ca.tag + '] ' + ca.name + ' (' + ca.mmr + ' MMR).' });
      this.clanCast(ca, { t: 'clan', clan: this.clanView(ca) }); this.clanCast(cb, { t: 'clan', clan: this.clanView(cb) });
    }
    this.roomCast(A);
  };

  // uzun süre rakip bulunamadı: bot takıma karşı antrenman savaşı (MMR değişmez, XP x0.6)
  P.warBot = function (A) {
    this.stopWar(A);
    for (const mem of A.members) if (mem.conn) this.send(mem.conn, { t: 'notice', kind: 'gold', text: 'Rakip klan bulunamadı: bot takıma karşı antrenman savaşı başlıyor (MMR değişmez).' });
    this.launch(A);
  };

  // 1 Hz: eşleştirme, bakım
  P.slow = function () {
    const t = this.now();
    for (const k of Object.keys(this.queues)) { const mm = QRE.exec(k); if (mm) this.matchQueue(mm[1], +mm[2], t); }
    this.matchWars(t);
    for (const room of [...this.rooms.values()]) {
      if (room.state === 'lobby') {
        if (room.autoAt && t >= room.autoAt) { room.autoAt = 0; if (room.members.length) this.launch(room); }
        else if (!room.persist && t - room.active > 30 * 60000) {
          for (const mm of room.members) if (mm.conn) this.send(mm.conn, { t: 'room', room: null });
          this.destroyRoom(room);
        }
      } else if (room.state === 'play' && room.emptySince && t - room.emptySince > 60000) this.destroyRoom(room);   // kimse dönmedi
    }
    const n = this._gc = (this._gc | 0) + 1;
    if (n % 5 === 0) this.flushDocs();
    if (n % 60 === 0) for (const [k, f] of this.fails) if (f.until < t) this.fails.delete(k);
  };

  // ---------- maç ----------
  // kişiye özel tasarım: kale direği / skor tabelası / çim. Klan maçında kendi klanının başkanının seçimi geçerlidir
  P.designFor = function (room, u) {
    let src = u;
    if (room.kind === 'clan' && u.clan) {
      const c = this.store.getClan(u.clan), L = c && this.store.getUser(c.leader);
      if (L) src = L;
    }
    const e = src.eq || {}, mine = u.eq || {};
    return { post: e.post || 0, board: e.board || 0, turf: mine.turf || 0 };
  };

  P.startMsg = function (room, mem, user) {
    const sim = room.sim, u = (mem && mem.user) || user;
    return { t: 'start', mode: sim.n, W: sim.W, H: sim.H, GW: sim.GW, seconds: room.seconds, you: mem.pi, kind: room.kind, war: room.war,
      clans: room.clans, logos: room.clans.map((tag) => { const c = tag && this.store.getClan(tag); return c ? c.logo : null; }),
      roster: room.roster, tick: TICK, snapDiv: SNAP_DIV, design: u ? this.designFor(room, u) : { post: 0, board: 0, turf: 0 }, spec: mem.pi < 0 };
  };

  P.launch = function (room) {
    // botsuz odalarda takım başına oyuncu sayısı kadar oynanır (eşit takımlar); aksi halde oda modu
    const noBots = !room.bots || room.kind === 'rankroom' || room.kind === 'rank';
    const n = noBots ? Math.max(2, Math.min(room.mode, Math.max(countTeam(room, 0), countTeam(room, 1)))) : room.mode;
    const seed = (Math.random() * 2147483647) | 0;
    const sim = new Sim(n, { seed, seconds: room.seconds, golden: this.env.golden !== false });
    const rnd = mulberry32(seed ^ 0x9e3779b9);
    const roster = new Array(n * 2);
    let sum = 0;
    for (const m of room.members) sum += overall(m.user.card.st, m.user.card.pos);
    const avg = room.members.length ? sum / room.members.length : 60;
    const usedNames = new Set(room.members.map((m) => key(m.user.name)));
    // klan maçlarında her takım kendi klanının formasını giyer
    const kits = room.clans.map((tag) => { const c = tag && this.store.getClan(tag); return c ? c.kit : null; });
    for (let t = 0; t < 2; t++) {
      const mine = room.members.filter((m) => m.team === t)
        .sort((a, b) => (b.user.card.pos === 'KL') - (a.user.card.pos === 'KL') || overall(b.user.card.st, b.user.card.pos) - overall(a.user.card.st, a.user.card.pos));
      const taken = new Array(n).fill(false);
      for (const m of mine) {
        let s = slotFor(n, m.user.card.pos, taken);
        if (s < 0) s = taken.indexOf(false);
        taken[s] = true;
        const p = sim.addPlayer(t, s, m.user.card.st, false);
        m.pi = p.i; m.left = false; m.ack = 0;
        if (m.conn) m.conn.pi = p.i;
        const card = cardView(m.user.name, m.user.card);
        if (kits[t]) card.look = Object.assign({}, card.look, kits[t]);
        roster[p.i] = { i: p.i, team: t, slot: s, name: m.user.name, clan: m.user.clan, bot: false, card };
      }
      for (let s = 0; s < n; s++) {
        if (taken[s]) continue;
        if (noBots) continue;
        const st = botStats(clamp(avg - 6 + rnd() * 10, 45, 90), rnd), pos = FORMATIONS[n][s].pos;
        const p = sim.addPlayer(t, s, st, true);
        let name = BOT_NAMES[Math.floor(rnd() * BOT_NAMES.length)];
        for (let g = 0; usedNames.has(key(name)) && g < 20; g++) name = BOT_NAMES[Math.floor(rnd() * BOT_NAMES.length)];
        usedNames.add(key(name));
        const ovr = overall(st, pos), look = randLook(rnd);
        look.kit = t === 0 ? 0 : 1;                 // botlar takım formasıyla çıkar
        look.stripe = 0;
        if (kits[t]) Object.assign(look, kits[t]);
        roster[p.i] = { i: p.i, team: t, slot: s, name, clan: null, bot: true,
          card: { name, pos, ovr, tier: tierOf(ovr).id, st, look, lvl: 0, xp: 0, next: 0 } };
      }
    }
    sim.kickoff(); sim.phaseT = 3;
    room.sim = sim; room.roster = roster; room.state = 'play'; room.goalsSeen = 0; room.active = this.now();
    this.playing.add(room);
    this.m.matches++;
    for (const m of room.members) if (m.conn) this.send(m.conn, this.startMsg(room, m));
    for (const c of room.specs) this.send(c, this.startMsg(room, { pi: -1 }, c.user));
  };

  // bir sabit adım: tüm maçlar (40 Hz)
  P.step = function () {
    this.tickN++;
    let done = null;
    for (const room of this.playing) {
      const sim = room.sim, pl = sim.players;
      for (let i = 0; i < pl.length; i++) if (pl[i].bot) think(sim, pl[i]);
      sim.step();
      if (sim.goals.length !== room.goalsSeen) this.announceGoals(room);
      if (sim.tick % SNAP_DIV === 0 || sim.phase === PHASE.END) {
        const acks = [];
        for (const m of room.members) if (m.conn && !m.left) acks.push([m.pi, m.ack & 0xffff]);

          for (const m of room.members) {
            const c = m.conn;
            if (c && !m.left && c.canSend()) { c.sendBin(u); this.m.snaps++; this.m.snapBytes += u.length; }
          }
          for (const c of room.specs) if (c.canSend()) c.sendBin(u);
        }
        sim.ev = 0;
      }
      if (sim.phase === PHASE.END) (done || (done = [])).push(room);
    }
    if (done) for (const room of done) this.finishMatch(room);
  };

  P.announceGoals = function (room) {
    const sim = room.sim;
    for (let i = room.goalsSeen; i < sim.goals.length; i++) {
      const g = sim.goals[i];
      this.m.goals++;
      const s = JSON.stringify({ t: 'goal', team: g.team, scorer: g.scorer, assist: g.assist, og: g.og, score: sim.score.slice(), at: g.t });
      for (const m of room.members) if (m.conn && !m.left) m.conn.send(s);
      for (const c of room.specs) c.send(s);
    }
    room.goalsSeen = sim.goals.length;
  };

  P.finishMatch = function (room) {
    const sim = room.sim, res = sim.result(), st = this.store, kind = room.kind;
    this.playing.delete(room);
    const hc = [0, 0], sums = [0, 0];
    for (const m of room.members) { hc[m.team]++; sums[m.team] += m.user.mmr; }
    const both = hc[0] > 0 && hc[1] > 0;
    const rankRated = (kind === 'rank' || kind === 'rankroom') && both;
    const warRated = kind === 'clan' && room.war && both && !!room.clans[0] && !!room.clans[1];
    const xpKind = kind === 'rank' || kind === 'rankroom' || kind === 'clan';           // seviye / XP yalnızca rank ve klan maçlarından
    const full = rankRated || warRated;                          // gerçek rakibe karşı: tam XP
    const avg = [hc[0] ? sums[0] / hc[0] : 1000, hc[1] ? sums[1] / hc[1] : 1000];

    // klan savaşı: iki klanın MMR'ı sıfır toplamlı değişir (Elo, K=32)
    const warBy = {};
    if (warRated) {
      const A = st.getClan(room.clans[0]), B = st.getClan(room.clans[1]);
      if (A && B && A !== B) {
        const ea = 1 / (1 + Math.pow(10, (B.mmr - A.mmr) / 400));
        const dA = Math.round(32 * ((res.winner === 0 ? 1 : res.winner === -1 ? 0.5 : 0) - ea));
        const a0 = A.mmr, b0 = B.mmr;
        A.mmr = Math.max(0, A.mmr + dA); B.mmr = Math.max(0, B.mmr - dA);
        for (const [c, t, d0, opp] of [[A, 0, a0, B], [B, 1, b0, A]]) {
          if (res.winner === t) c.w++; else if (res.winner === -1) c.d++; else c.l++;
          const d = c.mmr - d0;
          c.hist.unshift({ at: this.now(), opp: opp.tag, oppName: opp.name, sc: [res.score[t], res.score[1 - t]], d, r: res.winner === t ? 'W' : res.winner === -1 ? 'D' : 'L' });
          if (c.hist.length > 8) c.hist.length = 8;
          st.putClan(c);
          warBy[c.tag] = { tag: c.tag, mmr: c.mmr, d, opp: opp.tag, oppName: opp.name };
        }
      }
    }

    const msgs = [];
    for (const m of room.members) {
      const u = m.user, card = u.card, ps = res.players[m.pi], t = m.team, s = u.stats;
      const won = res.winner === t, draw = res.winner === -1;
      const slotPos = FORMATIONS[sim.n][sim.players[m.pi].slot].pos;
      const before = cardView(u.name, card), mmr0 = u.mmr;
      let xp = 0;
      if (xpKind) {
        xp = 20 + (won ? 40 : draw ? 20 : 10) + ps.goals * 14 + ps.assists * 9 + ps.saves * 6 + (ps.cs && (slotPos === 'KL' || slotPos === 'DEF') ? 20 : 0);
        if (!full) xp = Math.round(xp * 0.6);
        if (m.left) xp = 0;
      }
      const ups = xp ? addXp(card, xp) : 0;
      let dm = 0;
      if (rankRated) {
        const exp = 1 / (1 + Math.pow(10, (avg[1 - t] - avg[t]) / 400));
        dm = Math.round((s.rm < 10 ? 32 : 24) * ((won ? 1 : draw ? 0.5 : 0) - exp));   // ilk 10 rank maçında daha hızlı oturur
        if (m.left) dm = Math.min(dm, 0);
        u.mmr = Math.max(0, u.mmr + dm); dm = u.mmr - mmr0;
        s.rm++;
      }
      if (kind !== 'practice') {
        s.m++; if (won) s.w++; else if (draw) s.d++; else s.l++;
        s.g += ps.goals; s.a += ps.assists; s.s += ps.saves; if (ps.cs) s.cs++;
        if (kind === 'clan') s.cm++; else s.sm++;
      }
      // kazanılan her maçın ödülü (antrenman ve maçı terk edenler hariç)
      let gold = 0, gems = 0;
      if (won && !m.left && kind !== 'practice') { gold = GIFT_GOLD; gems = GIFT_GEM; u.gold = (u.gold || 0) + gold; u.gems = (u.gems || 0) + gems; }
      st.putUser(u);
      if (m.conn && !m.left) {
        msgs.push([m.conn, {
          t: 'result', kind, score: res.score, winner: res.winner, team: t, golden: res.golden, goals: res.goals, rated: full, xpKind,
          stats: { goals: ps.goals, assists: ps.assists, saves: ps.saves, shots: ps.shots }, gold, gems, xp, ups, gp: ups * GP_PER_LEVEL, mmrDelta: dm,
          war: (u.clan && warBy[u.clan]) || null,
          before: { ovr: before.ovr, lvl: before.lvl, st: before.st, mmr: mmr0 }, me: null,
        }]);
      }
    }
    this.lbCache = null;
    for (const [cn, msg] of msgs) { msg.me = this.meView(cn.user); this.send(cn, msg); }
    room.sim = null; room.roster = null;
    for (const c of room.specs) this.send(c, { t: 'spec.end', score: res.score });
    if (room.kind === 'custom' || room.kind === 'clan' || room.kind === 'lobby' || room.kind === 'rankroom') {
      room.state = 'lobby'; room.war = false; room.searching = false; room.autoAt = 0;
      room.members = room.members.filter((m) => m.conn && !m.left);
      for (const m of room.members) { m.pi = -1; m.ack = 0; if (m.conn) m.conn.pi = -1; }
      this.afterRoomChange(room);
    } else this.destroyRoom(room);
  };
};

};
defs["src/server/shop.js"]=function(module,exports,require){
'use strict';
/* Mağaza: ürün satın alma (Altın / Elmas), kuşanma ve Hediye Kodları. Hub.prototype'a eklenir.
   Kart üzerinde görünen ürünler (forma deseni, saç, krampon, top, efekt, kart arka planı, lakap) kartın `look` alanına yazılır;
   kişisel ürünler (çim, kale direği, skor tabelası, emoji) hesabın `eq` / `inv` alanında kalır. */
const { ITEM_BY } = require("src/core/consts.js");
const { sanitizeLook } = require("src/core/cards.js");
const { cleanText: clean } = require("src/server/util.js");

// Hediye kodları. ADMIN_CODE tüm oyun genelinde TEK SEFERLİKTİR: bir oyuncu kullandığında sunucu belgesine
// ('sys' / 'admin') yazılır ve kod kalıcı olarak geçersiz olur.
const CODE_GIFT = 'mavi', ADMIN_CODE = 'jsjwhjsjsnsvsiivsj';
const EQ_CATS = { turf: 1, post: 1, board: 1 };

module.exports = function install(Hub) {
  const P = Hub.prototype;

  P.shopMsg = function (conn, m) {
    const u = conn.user, st = this.store, now = this.now();
    const fail = (msg) => this.err(conn, 'shop', msg);
    const ok = (text) => this.send(conn, { t: 'notice', kind: 'ok', text });
    const refresh = () => { st.putUser(u); this.mkCache = null; this.send(conn, { t: 'me', me: this.meView(u) }); };
    switch (m.t) {
      case 'store.buy': {
        const it = ITEM_BY[String(m.id)];
        if (!it) return fail('Ürün bulunamadı.');
        if (u.inv.includes(it.id)) return fail('Bu ürüne zaten sahipsin.');
        const cur = m.cur === 'd' ? 'd' : 'g', price = it[cur];
        if (!price) return fail('Bu ürün bu para birimiyle satılmıyor.');
        const key = cur === 'g' ? 'gold' : 'gems';
        if ((u[key] || 0) < price) return fail(cur === 'g' ? 'Yeterli Altının yok.' : 'Yeterli Elmasın yok.');
        u[key] -= price; u.inv.push(it.id);
        refresh();
        return ok(it.name + ' satın alındı.');
      }
      case 'store.equip': {
        const cat = String(m.cat || '');
        if (m.id == null) {                                    // varsayılana dön
          if (EQ_CATS[cat]) u.eq[cat] = 0;
          else if (u.card) {
            const field = { pat: 'stripe', hair: 'hs', boot: 'boots', ball: 'bl', gfx: 'gf', sfx: 'sf', cbg: 'cbg', ttl: 'ttl' }[cat];
            if (!field) return fail('Geçersiz kategori.');
            u.card.look = Object.assign({}, u.card.look, { [field]: field === 'hs' ? 1 : 0 });
          }
          return refresh();
        }
        const it = ITEM_BY[String(m.id)];
        if (!it || !u.inv.includes(it.id)) return fail('Bu ürüne sahip değilsin.');
        if (it.cat === 'emoji') return fail('Emojiler oyun içinde Emoji düğmesinden kullanılır.');
        if (EQ_CATS[it.cat]) u.eq[it.cat] = it.val;
        else {
          if (!u.card) return fail('Önce kartını oluştur.');
          u.card.look = sanitizeLook(Object.assign({}, u.card.look, { [it.field]: it.val }), u.card.lvl, u.inv);
        }
        return refresh();
      }
      case 'gift': {
        const code = clean(m.code, 40).toLowerCase();
        if (!code) return fail('Bir kod gir.');
        if (!this.guard(conn, 'gift:' + (conn.ip || conn.id), 12, 600000)) return fail('Çok fazla deneme. Biraz bekle.');
        if (code === CODE_GIFT) {
          if (u.codes.includes(CODE_GIFT)) return fail('Bu kodu zaten kullandın.');
          u.codes.push(CODE_GIFT); u.gold += 1000; u.gems += 1000;
          refresh();
          return ok('Hediye kodu kabul edildi: +1000 Altın, +1000 Elmas!');
        }
        if (code === ADMIN_CODE) {
          const sys = st.docs('sys');
          if (sys.get('admin')) return fail('Bu kod daha önce kullanıldı ve kalıcı olarak geçersiz.');
          st.putDoc('sys', 'admin', { by: u.name, at: now });       // önce kodu yak, sonra yetkiyi ver
          u.role = 'owner'; u.codes.push('admin');
          refresh();
          return ok('Ana Admin yetkisi hesabına tanımlandı. Bu kod artık geçersiz.');
        }
        return fail('Geçersiz hediye kodu.');
      }
      default: return undefined;
    }
  };
};
};
defs["src/server/social.js"]=function(module,exports,require){
'use strict';
/* Sosyal sistem: arkadaşlık, engelleme, susturma, şikayet, profil, çevrimiçi oyuncular,
   Transfer Pazarı, ülke seçimi, gelişim (stat yükseltme) ve Seviye Pass ödülleri. Hub.prototype'a eklenir. */
const { cardView, applyUpgrade, claimPass, marketValue } = require("src/core/cards.js");
const { COUNTRY_BY, POSITIONS, leagueOf } = require("src/core/consts.js");
const { key } = require("src/server/store.js");
const { cleanText: clean } = require("src/server/util.js");

const MAX_FRIENDS = 50, MAX_REQ = 30, MAX_BLOCK = 100, MAX_MUTE = 100;
const REPORT_REASONS = ['hakaret', 'spam', 'hile', 'isim', 'diger'];
const SORTS = ['value', 'ovr', 'g', 'a', 'lvl'];
const UP_ERR = { bad: 'Geçersiz istek.', max: 'Bir özellik zaten en üst seviyede (99).', none: 'Değişiklik yok.', pts: 'Yeterli gelişim puanın yok.' };

module.exports = function install(Hub) {
  const P = Hub.prototype;

  // listelerde / profilde gösterilen kısa oyuncu satırı
  P.playerRow = function (x) {
    const v = x.card ? cardView(x.name, x.card) : null;
    return {
      name: x.name, pos: v ? v.pos : '', ovr: v ? v.ovr : 0, tier: v ? v.tier : 'bronz', lvl: x.card ? x.card.lvl : 0,
      clan: x.clan, country: x.country, online: this.online.has(key(x.name)), mmr: x.mmr, league: leagueOf(x.mmr).id, look: v ? v.look : null,
      role: x.role || '', nc: x.nc || '',
    };
  };

  // u'nun t ile ilişkisi
  P.relOf = function (u, t) {
    if (u === t) return 'self';
    if (u.blocked.includes(t.name)) return 'blocked';
    if (u.friends.includes(t.name)) return 'friend';
    if (u.freq.includes(t.name)) return 'req_in';
    if (t.freq.includes(u.name)) return 'req_out';
    return 'none';
  };

  const drop = (arr, name) => { const i = arr.indexOf(name); if (i >= 0) arr.splice(i, 1); };

  P.befriend = function (a, b) {
    drop(a.freq, b.name); drop(b.freq, a.name);
    if (!a.friends.includes(b.name)) a.friends.push(b.name);
    if (!b.friends.includes(a.name)) b.friends.push(a.name);
    this.store.putUser(a); this.store.putUser(b);
    this.pushMe(a.name); this.pushMe(b.name);
    this.sendTo(a.name, { t: 'notice', kind: 'ok', text: b.name + ' ile arkadaş oldunuz.' });
    this.sendTo(b.name, { t: 'notice', kind: 'ok', text: a.name + ' ile arkadaş oldunuz.' });
  };

  P.socialMsg = function (conn, m) {
    const u = conn.user, st = this.store, now = this.now();
    const fail = (msg) => this.err(conn, 'social', msg);
    const ok = (text) => this.send(conn, { t: 'notice', kind: 'ok', text });
    const tgt = () => st.getUser(clean(m.name, 16));
    switch (m.t) {
      case 'social': {                     // arkadaşlar, gelen istekler, çevrimiçi oyuncular
        const rows = (names) => names.map((n) => st.getUser(n)).filter((x) => x && x.card).map((x) => this.playerRow(x));
        const friends = rows(u.friends).sort((a, b) => (b.online - a.online) || b.ovr - a.ovr);

        for (const c of this.online.values()) {

      }
      case 'profile': {

          clanName: clan ? clan.name : null, value: card ? marketValue(card.ovr, card.lvl, t.stats) : 0,
          adm: this.isAdmin(u) ? { mute: this.muteLeft(t, now), ban: this.banLeft(t, now), canAct: u.role === 'owner' ? t.role !== 'owner' : (u.role === 'mod' && !t.role) } : null,
        }) });

      }

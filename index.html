<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Piksel Futbol</title>
<style>
/* Piksel Futbol — modern koyu tema, piksel vurgulu. Dikey (portrait) telefon öncelikli. */
:root{--bg:#22315a;--bg2:#2b3c6d;--panel:#33477f;--panel2:#3f559a;--line:#5a73b8;--text:#f5f8ff;--dim:#c0cdf0;--gold:#ffd75a;--green:#3ddc84;--red:#ff5a6e;--blue:#4da3ff;--r:14px;--nav:64px;
  --font:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--font);font-size:15px;line-height:1.35;overscroll-behavior:none;-webkit-text-size-adjust:100%}
body{background:radial-gradient(1200px 700px at 50% -10%,#4a63b0 0,#22315a 65%)}
#app{position:fixed;inset:0;overflow:hidden}
#screen,.screen{height:100%}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:default;opacity:.45}
input,select{font:inherit;color:var(--text);background:#0c1124;border:1px solid var(--line);border-radius:10px;padding:11px 12px;width:100%;min-height:44px;outline:none}
input:focus,select:focus{border-color:var(--blue);box-shadow:0 0 0 2px rgba(77,163,255,.25)}
input[type=range]{padding:0;min-height:28px;accent-color:var(--gold);background:none;border:0}
input[type=number]{-moz-appearance:textfield}
b{font-weight:700}
small{font-size:.8em}
.ico{display:block;flex:none}
.grow{flex:1;min-width:0}
.dim{color:var(--dim)} .sm{font-size:12px} .center{text-align:center} .left{text-align:left}
.sp{height:10px} .pad2{padding:14px 6px}
.pos{color:var(--green)} .neg{color:var(--red)} .gold{color:var(--gold)}
.row{display:flex;align-items:center;gap:8px} .row.wrap{flex-wrap:wrap} .row.cc{justify-content:center}
.pad{padding:12px 14px 22px;display:flex;flex-direction:column;gap:12px}
.lbl{font-size:11px;letter-spacing:.14em;color:var(--dim);font-weight:700;text-transform:uppercase;margin:2px 0 6px}
canvas.av,canvas.card,canvas.kitprev,canvas.logo,canvas.parade,canvas.spin{image-rendering:pixelated;image-rendering:crisp-edges}
canvas.card{max-width:100%;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.45)}

/* ---- düğmeler ---- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 16px;border:0;border-radius:12px;font-weight:800;letter-spacing:.04em;font-size:13px;background:var(--panel2);color:var(--text);box-shadow:inset 0 -3px 0 rgba(0,0,0,.28);transition:transform .08s,filter .15s;position:relative}
.btn:active:not(:disabled){transform:translateY(1px) scale(.99);filter:brightness(1.1)}
.btn.gold{background:linear-gradient(#ffe083,#f1b92e);color:#3a2800}
.btn.green{background:linear-gradient(#58e69a,#22b866);color:#05261a}
.btn.red{background:linear-gradient(#ff7587,#e0384e);color:#fff}
.btn.blue{background:linear-gradient(#6db4ff,#2f7fe0);color:#06183a}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--text);box-shadow:none}
.btn.sm{min-height:36px;padding:0 12px;font-size:12px;border-radius:10px}
.btn.xs{min-height:28px;padding:0 9px;font-size:10px;border-radius:8px;letter-spacing:.02em}
.btn.lg{min-height:54px;font-size:15px;border-radius:14px}
.btn.block{display:flex;width:100%}
.btn small{font-weight:600;opacity:.8;font-size:10px}
.btn .cnt{background:#d62d44;color:#fff;border-radius:99px;font-size:11px;padding:1px 7px;margin-left:4px}
.modes .btn{flex-direction:column;gap:0;min-height:66px;font-size:20px}

/* ---- kabuk ---- */
.shell{max-width:560px;margin:0 auto;height:100%;display:flex;flex-direction:column;background:var(--bg);box-shadow:0 0 0 1px #151b33,0 0 60px rgba(0,0,0,.5)}
.topbar{flex:none;height:48px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;padding-top:env(safe-area-inset-top);box-sizing:content-box;background:linear-gradient(#3a508f,#2f4379);border-bottom:1px solid var(--line)}
.ttl{display:flex;align-items:center;gap:8px;font-weight:900;letter-spacing:.16em;font-size:14px;color:var(--gold)}
.conn{font-size:11px;color:var(--green)} .conn.bad{color:var(--red)} .conn.demo{color:var(--gold)}
.view{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.view.fill{overflow:hidden;display:flex;flex-direction:column}
.nav{flex:none;height:calc(var(--nav) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);display:grid;grid-template-columns:repeat(6,1fr);background:rgba(38,54,100,.92);backdrop-filter:blur(10px);border-top:1px solid var(--line);z-index:5}
.navbtn{background:none;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--dim);position:relative;padding:4px 0;min-width:0}
.navbtn .nlb{font-size:10px;font-weight:700;letter-spacing:.02em;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.navbtn.on{color:var(--gold)}
.navbtn.on::before{content:"";position:absolute;top:0;left:22%;right:22%;height:3px;background:var(--gold);border-radius:0 0 4px 4px;box-shadow:0 0 12px var(--gold)}
.nic{position:relative;display:block}
.dotb{position:absolute;right:-5px;top:-3px;width:10px;height:10px;border-radius:50%;background:var(--red);border:2px solid #0b1020}
.dotb[hidden]{display:none}

/* ---- paneller ---- */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.sechead{display:flex;justify-content:space-between;align-items:baseline;margin-top:6px;font-size:13px;letter-spacing:.1em}
.seg{display:flex;background:#0c1124;border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;border-radius:9px;min-height:38px;font-weight:800;font-size:12px;color:var(--dim);letter-spacing:.04em;padding:0 8px}
.seg button.on{background:var(--panel2);color:var(--gold);box-shadow:inset 0 0 0 1px var(--line)}
.seg.sm button{min-height:32px;font-size:11px}
.seg.xs button{min-height:28px;font-size:10px;padding:0 4px}
.bar{height:10px;background:#1b2745;border:1px solid var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#ffd75a,#ff9f43);border-radius:99px;transition:width 1.1s cubic-bezier(.2,.8,.2,1)}
.badge{display:inline-flex;align-items:center;justify-content:center;min-width:30px;padding:2px 7px;border-radius:7px;font-size:12px;font-weight:900;letter-spacing:.03em;border:1px solid rgba(255,255,255,.18)}
.tier-bronz{background:#6d4524;color:#ffd9b0}.tier-gumus{background:#58627a;color:#fff}.tier-altin{background:#9c7413;color:#fff4c2}.tier-elit{background:linear-gradient(135deg,#5b2bd1,#1e90ff);color:#fff}
span.lg{display:inline-flex;align-items:center;gap:2px;padding:2px 8px;border-radius:7px;font-size:10px;font-weight:900;letter-spacing:.08em;color:var(--c);border:1px solid var(--c);background:rgba(255,255,255,.04)}
span.lg b{color:#fff}
span.cc{display:inline-block;padding:1px 5px;border-radius:5px;font-size:10px;font-weight:800;background:#202a4c;color:#b9c6f0;letter-spacing:.04em}
.ctag{display:inline-block;padding:1px 6px;border-radius:5px;font-size:11px;font-weight:900;background:#3a2c0a;color:var(--gold);border:1px solid #7a5d12;letter-spacing:.05em}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips.col{flex-direction:column}
.chip{display:inline-flex;align-items:center;gap:5px;min-height:38px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:#0c1124;font-weight:700;font-size:13px;color:var(--text)}
.chip small{color:var(--dim);font-size:10px}
.chip.on{border-color:var(--gold);color:var(--gold);background:#1f1a0a}
.chip.lk{opacity:.5}
.sw{position:relative;width:38px;height:38px;border-radius:10px;border:2px solid var(--line);padding:0;overflow:hidden}
.sw.on{border-color:var(--gold);box-shadow:0 0 0 2px rgba(255,215,90,.35)}
.sw.kit i{position:absolute;left:0;right:0;bottom:0;height:35%}
.sw.lk{opacity:.55}
.lkico{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.5);color:#fff}
.opt{margin-bottom:12px}
.hint{margin-top:6px}
.sel{appearance:auto}
.status{min-height:18px;font-size:12px;color:var(--dim);text-align:center}.status.bad{color:var(--red)}
.okline{display:flex;align-items:center;gap:6px;justify-content:center;color:var(--green);font-weight:700}

/* ---- sheet / diyalog / toast ---- */
#layer{position:fixed;inset:0;pointer-events:none;z-index:50}
.back{position:fixed;inset:0;background:rgba(3,5,12,.62);opacity:0;transition:opacity .22s;pointer-events:none;z-index:50}
.back.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;margin:0 auto;width:100%;max-width:560px;max-height:90dvh;max-height:90vh;display:flex;flex-direction:column;background:var(--bg2);border:1px solid var(--line);border-bottom:0;border-radius:20px 20px 0 0;transform:translateY(105%);transition:transform .24s cubic-bezier(.2,.8,.2,1);pointer-events:auto;z-index:50;padding-bottom:env(safe-area-inset-bottom)}
.sheet.on{transform:none}
.sheet.tall{height:90dvh;height:90vh}
.shead{flex:none;position:relative;display:flex;align-items:center;justify-content:center;padding:16px 52px 10px;border-bottom:1px solid var(--line)}
.grab{position:absolute;top:6px;left:50%;width:40px;height:4px;margin-left:-20px;border-radius:4px;background:#34406a}
.sttl{font-weight:900;letter-spacing:.12em;font-size:13px;color:var(--gold);text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.xbtn{position:absolute;right:10px;top:9px;width:36px;height:36px;border-radius:10px;border:0;background:var(--panel2);display:flex;align-items:center;justify-content:center;color:var(--text)}
.sbody{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:14px 16px 20px;-webkit-overflow-scrolling:touch}
.dlg{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(92vw,380px);max-height:88vh;overflow:auto;background:var(--bg2);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 20px 60px rgba(0,0,0,.6);pointer-events:auto;z-index:50}
.dtext{margin:0 0 12px;font-size:14px;color:#cfd7f2}
.dlg .row{justify-content:center;margin-top:12px}
#toast{position:fixed;left:0;right:0;bottom:calc(var(--nav) + 18px + env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;z-index:90;padding:0 12px}
.toast{background:#1c2547;border:1px solid var(--line);color:#fff;padding:10px 14px;border-radius:12px;font-size:13px;font-weight:600;max-width:420px;box-shadow:0 8px 24px rgba(0,0,0,.5);animation:tin .2s ease-out}
.toast.err{background:#4a1722;border-color:#a1304a}.toast.ok{background:#0f3a28;border-color:#1f8a5a}.toast.gold{background:#3d2f08;border-color:#a17d14;color:#ffe9a6}
@keyframes tin{from{transform:translateY(10px);opacity:0}}
.qtitle{font-weight:900;letter-spacing:.1em;color:var(--gold);margin-bottom:6px}
.qtxt{font-size:18px;font-weight:800;margin:8px 0}
.qsub{font-size:12px;margin-bottom:6px}
canvas.spin{width:48px;height:48px;animation:rot 1.2s linear infinite;margin:6px auto;display:block}
@keyframes rot{to{transform:rotate(360deg)}}

/* ---- giriş / kart oluşturma ---- */
.auth{min-height:100%;display:flex;align-items:center;justify-content:center;padding:20px;overflow-y:auto}
.authbox{width:100%;max-width:360px;display:flex;flex-direction:column;align-items:center;gap:14px}
.authbox .tag{color:var(--dim);font-size:12px;letter-spacing:.08em;text-align:center}
.authbox .seg{width:100%}
canvas.logo{width:min(80vw,300px);height:auto}
canvas.parade{width:236px;height:48px}
.authform{display:flex;flex-direction:column;gap:10px;width:100%}
.demo-note{font-size:11px;color:var(--gold);text-align:center;background:#2a220a;border:1px solid #6f5810;border-radius:10px;padding:8px}
.create{max-width:560px;margin:0 auto;padding:16px 16px 28px;height:100%;overflow-y:auto}
.ctitle{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;font-size:18px}
.prev{display:flex;justify-content:center;padding:10px 0 16px}
.reveal{text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px}
.flip{animation:flip .9s cubic-bezier(.2,.8,.2,1);perspective:800px}
@keyframes flip{from{transform:rotateY(180deg) scale(.7);opacity:0}to{transform:none;opacity:1}}

/* ---- Maç sekmesi ---- */
.tile{display:flex;align-items:center;gap:14px;width:100%;text-align:left;border:1px solid var(--line);border-radius:18px;padding:16px;background:linear-gradient(135deg,var(--panel2),var(--panel));position:relative;overflow:hidden;min-height:84px}
.tile::after{content:"";position:absolute;right:-20px;top:-20px;width:110px;height:110px;border-radius:50%;opacity:.14;background:var(--tc)}
.t-quick{--tc:var(--green);border-color:#1f6a48}.t-custom{--tc:var(--blue);border-color:#27598f}.t-rank{--tc:var(--gold);border-color:#8a6c18}
.tic{width:54px;height:54px;border-radius:14px;display:flex;align-items:center;justify-content:center;background:var(--tc);color:#101426;flex:none}
.ttx{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.ttx b{font-size:16px;letter-spacing:.06em}.ttx small{color:var(--dim);font-size:12px}
.tgo{color:var(--dim)}
.xpmini{margin-top:6px;display:flex;flex-direction:column;gap:3px}
.lobbies{display:flex;flex-direction:column;gap:8px}
.lrow{display:flex;align-items:center;gap:10px;padding:8px 0}
.lrow.lob{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.lno{width:34px;height:34px;border-radius:9px;background:var(--panel2);display:flex;align-items:center;justify-content:center;font-weight:900;color:var(--gold);flex:none}
.occ{font-size:13px;color:var(--dim);min-width:34px;text-align:right}.occ b{color:var(--text);font-size:15px}

/* ---- İstatistikler ---- */
.split{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.half{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;gap:8px;min-width:0}
.hh{display:flex;align-items:center;justify-content:space-between;gap:6px;flex-wrap:wrap}
.hh b{font-size:11px;letter-spacing:.12em;color:var(--gold)}
.plistv{display:flex;flex-direction:column;gap:3px;max-height:158px;overflow-y:auto}
.prow2{display:flex;align-items:center;gap:6px;background:#0d1226;border:0;border-radius:9px;padding:4px 6px;text-align:left;min-height:34px;width:100%}
.prow2 .pn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px;font-weight:700}
.prow2 .badge{min-width:24px;font-size:11px;padding:1px 4px}
.st{width:8px;height:8px;border-radius:50%;background:#3a4468;flex:none}.st.on{background:var(--green);box-shadow:0 0 6px var(--green)}
.reqrow{display:flex;align-items:center;gap:5px;background:#2a220a;border:1px solid #6f5810;border-radius:9px;padding:4px 6px}
.reqrow .pn{flex:1;font-size:12px;font-weight:700;display:flex;flex-direction:column;line-height:1.1}.reqrow small{color:var(--dim);font-weight:500}
.rbtn{width:34px;height:34px;border-radius:9px;border:0;background:var(--panel2);color:var(--text);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:18px;flex:none}
.rbtn.ok{background:var(--green);color:#052}
.plv2{display:flex;align-items:baseline;gap:8px}.plv2 small{color:var(--dim);font-size:10px;letter-spacing:.1em}.plv2 b{font-size:34px;color:var(--gold);line-height:1}
.nextrw{display:flex;flex-direction:column;font-size:12px;font-weight:700}.nextrw small{color:var(--dim);font-size:10px;letter-spacing:.1em}
.cardbox{display:flex;justify-content:center;padding:6px 0}
.lstrip{display:flex;align-items:center;justify-content:center;gap:8px}
.cta{display:flex;gap:10px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:2px;min-height:76px;justify-content:center}
.stile b{font-size:26px;line-height:1.1;font-variant-numeric:tabular-nums}.stile span{font-size:11px;color:var(--dim);font-weight:700;letter-spacing:.03em}
.stile.gold b{color:var(--gold)}
.stile.minor{min-height:60px}.stile.minor b{font-size:20px}
.kvs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kv{background:#0d1226;border-radius:10px;padding:8px;text-align:center;display:flex;flex-direction:column}.kv b{font-size:18px}.kv span{font-size:10px;color:var(--dim)}

/* ---- sheet içerikleri ---- */
.phead{display:flex;gap:14px;align-items:center;margin-bottom:12px}
.pinfo{display:flex;flex-direction:column;gap:6px;min-width:0}.pnm{font-size:20px;font-weight:900;word-break:break-word}
.on-dot{color:var(--green);font-size:12px;font-weight:700}
.acts{margin-bottom:10px}
.agrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.upsum{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.gp{display:flex;align-items:center;gap:6px;color:var(--gold)}.gp b{font-size:30px}.gp span{font-size:12px;color:var(--dim)}
.ovrchg{font-size:16px}.ovrchg b{font-size:22px}
.uprows{display:flex;flex-direction:column;gap:8px;margin:12px 0}
.uprow{display:grid;grid-template-columns:78px 1fr 52px 40px 52px;gap:6px;align-items:center}
.upn{font-weight:800;font-size:13px}
.upbar{position:relative;height:12px;background:#0a0e1d;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.upbar i{position:absolute;left:0;top:0;bottom:0;background:var(--blue)}.upbar i.add{background:var(--green)}
.upv{text-align:right;font-variant-numeric:tabular-nums}.upv b{font-size:16px}
.rbtn.plus{width:auto;background:var(--green);color:#052;flex-direction:row;gap:2px;font-size:16px}.rbtn.plus small{font-size:10px;opacity:.7}
.rbtn:disabled{background:var(--panel2);color:var(--dim)}
.passwrap{display:flex;flex-direction:column;gap:10px;height:100%}
.passhead{display:flex;gap:12px;align-items:center}
.plv{display:flex;flex-direction:column;align-items:center;background:var(--panel2);border-radius:12px;padding:6px 14px}.plv small{font-size:9px;color:var(--dim);letter-spacing:.1em}.plv b{font-size:26px;color:var(--gold)}
.plist{flex:1;min-height:200px;overflow-y:auto;display:flex;flex-direction:column;gap:4px;position:relative}
.prow{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;background:#0d1226;border:1px solid transparent;min-height:44px}
.prow.done{background:#10231c}.prow.cur{border-color:var(--gold)}.prow.big{background:#1c1a0c}
.pl{width:32px;height:32px;border-radius:8px;background:var(--panel2);display:flex;align-items:center;justify-content:center;font-weight:900}
.prw{flex:1;display:flex;flex-wrap:wrap;gap:5px;min-width:0}
.rw{font-size:11px;font-weight:800;background:var(--panel2);border-radius:6px;padding:2px 7px;display:inline-flex;gap:3px;align-items:center}.rw.bonus{color:var(--gold);background:#3a2c0a}.rw.bonus.got{opacity:.5;text-decoration:line-through}.rw.unl{color:#9be7ff;background:#0f2d3a}
.pst{width:28px;display:flex;justify-content:center;color:var(--dim)}.prow.done .pst{color:var(--green)}
.mwrap{display:flex;flex-direction:column;gap:6px}
.msum{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.msum .kv b{font-size:14px}.msum .kv span{font-size:9px}
.mlist{display:flex;flex-direction:column;gap:5px;margin-top:6px}
.mrow{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:#0d1226;border:1px solid transparent;border-radius:11px;padding:6px 8px;min-height:48px}

const TEAM_FALLBACK = [0, 1];
const lerp = (a, b, t) => a + (b - a) * t;
const lerpAng = (a, b, t) => { let d = b - a; while (d > Math.PI) d -= 2 * Math.PI; while (d < -Math.PI) d += 2 * Math.PI; return a + d * t; };

function h(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) { if (text.nodeType) e.append(text); else e.textContent = text; } for (let i = 3; i < arguments.length; i++) if (arguments[i]) e.append(arguments[i]); return e; }

class Match {
  // start: sunucudan gelen 'start' mesajı; cbs: { onQuit() }
  constructor(root, net, start, cbs) {
    this.root = root; this.net = net; this.st = start; this.cbs = cbs || {};
    this.mode = start.mode; this.W = start.W; this.H = start.H; this.you = start.you;
    this.spec = this.you < 0; this.design = start.design || {}; this.board = BOARDS[this.design.board | 0] || BOARDS[0];
    this.roster = start.roster; this.n = this.mode * 2;
    this.L = layout(this.W, this.H);
    this.myTeam = this.spec ? 0 : this.roster[this.you].team; this.pitchSet = {}; this.camMode = false; this.qW = 0; this.qH = 0; this.portrait = false; this.cam = { x: 0, y: 0 }; this.camF = { x: 0, y: 0 }; this.camInit = false;
    this.P = { x: 0, y: 0 }; this.RV = { x: 0, y: 0 }; this.gfx = settings.get().gfx; this.lastDraw = 0;
    this.vw = this.L.VW; this.vh = this.L.VH; this.HL = this.L; this.v = null;
    this.pool = []; for (let i = 0; i < POOL; i++) this.pool.push({}); this.pi = 0; this.sn = [];
    this.offWin = []; this.off = null;
    this.vp = []; for (let i = 0; i < this.n; i++) this.vp.push({ x: 0, y: 0, vx: 0, vy: 0, dir: 0, flags: 0, stam: 1 });
    this.vb = { x: this.W / 2, y: this.H / 2, vx: 0, vy: 0, owner: -1 };
    this.view = { phase: PHASE.WAIT, clock: start.seconds, s0: 0, s1: 0, golden: false, phaseT: 3 };
    this.anim = new Array(this.n).fill(0); this.fx = []; this.banner = null; this.shake = 0; this.feed = [];
    this.bub = new Array(this.n).fill(null); this.chatLog = []; this.offs = []; this.skillUntil = 0; this.skillCd = 0; this.prevBtn = 0; this.ballSkin = 0; this.lastOwner = -1; this.items = []; this.inp = { ax: 0, ay: 0, btn: 0 };
    this.firedTick = -1; this.ballRoll = 0; this.lastBall = null; this.dribble = 0;
    this.ended = false; this.dead = false; this.celebrateTeam = -1; this.celebrateT = 0; this.startFlash = 0;
    // kıyafetler: takım başına tek forma (en yüksek reytingli insanın formasından), renkler çakışmasın
    this.kits = [0, 1].map((t) => {
      const hum = this.roster.filter((r) => r.team === t && !r.bot).sort((a, b) => b.card.ovr - a.card.ovr)[0];
      return KITS[hum ? hum.card.look.kit : TEAM_FALLBACK[t]];
    });
    if (this.kits[0][0] === this.kits[1][0]) { const i = KITS.indexOf(this.kits[1]); this.kits[1] = KITS[(i + 4) % KITS.length]; }
    const my = this.spec ? this.roster[0] : this.roster[this.you];
    this.me = { x: 0, y: 0, vx: 0, vy: 0, stamina: 1, sprinting: false, dir: my.team ? Math.PI : 0, d: derive(my.card.st, FORMATIONS[this.mode][my.slot].pos) };
    this.err = { x: 0, y: 0 }; this.hist = []; this.seq = 0; this.lastSent = { ax: 9, ay: 9, btn: -1 }; this.lastSendAt = 0; this.haveMe = false;
    this.keys = new Set(); this.joy = null; this.tbtn = 0; this.charge = 0; this.chargeOn = false;
    this.gkey = settings.get().gfx + '|' + settings.get().hideFans;
    this.build();
    this.bind();
    // ağ: oda sohbeti ve emojiler (konuşma balonları)
    const nm = (x) => this.roster.findIndex((r) => r.name === x);
    this.offs.push(net.on('chat', (m) => { if (m.ch !== 'room') return; this.chatLog.push(m); if (this.chatLog.length > 60) this.chatLog.shift(); const i = nm(m.from); if (i >= 0) this.bub[i] = { text: String(m.text).slice(0, 22), t0: performance.now() }; if (this.panelKind === 'chat') this.drawChatPanel(); }));
    this.offs.push(net.on('chat.hist', (m) => { if (m.ch === 'room') { this.chatLog = m.msgs.slice(-60); if (this.panelKind === 'chat') this.drawChatPanel(); } }));
    this.offs.push(net.on('emote', (m) => { if (this.bub[m.i] !== undefined && EMOJIS[m.e]) this.bub[m.i] = { e: EMOJIS[m.e], t0: performance.now() }; }));
    net.send({ t: 'chat.hist', ch: 'room' });
    // ikinci taraftar karesini ve kırpmayı oyun başlamadan hazırla (ilk çevirmedeki takılmayı önler)
    this.pre1 = setTimeout(() => { if (!this.dead) this.getPitch(0); }, 30); this.pre2 = setTimeout(() => { if (!this.dead && this.mode < 9 && this.st) this.getPitch(1); }, 700);
    this.offs.push(settings.on(() => { const g = settings.get(), k = g.gfx + '|' + g.hideFans; this.gfx = g.gfx; if (k !== this.gkey) { this.gkey = k; this.pitchSet = {}; } this.applyControls(); }));
    this.last = performance.now();
    this.raf = requestAnimationFrame((t) => this.frame(t));
  }

  // ---------- DOM ----------
  build() {
    const r = this.el = h('div', 'match');
    this.cv = h('canvas', 'mc'); r.appendChild(this.cv);
    this.ctx = this.cv.getContext('2d');
    // oyun içi HUD: skor tabelasının altında sağdan sola Çıkış, Ayarlar, Sohbet; biraz altında Emoji ve Hızlı Sohbet
    const hud = h('div', 'mhud'), row1 = h('div', 'mhr'), row2 = h('div', 'mhr r2');
    const mk = (label, fn, cls) => { const b = h('button', 'mh ' + (cls || ''), label); b.type = 'button'; b.onclick = () => { audio.click(); fn(); }; return b; };
    row1.append(mk('ÇIKIŞ', () => { if (this.cbs.onQuit) this.cbs.onQuit(); }, 'red'), mk('AYARLAR', () => this.panel('settings')), mk('SOHBET', () => this.panel('chat')));
    if (!this.spec) row2.append(mk('EMOJİ', () => this.panel('emoji')), mk('HIZLI SOHBET', () => this.panel('quick')));
    hud.append(row1, row2); r.appendChild(hud); this.mtop = hud;
    const touch = matchMedia('(pointer: coarse)').matches || 'ontouchstart' in window;
    if (touch && !this.spec) {
      const z = h('div', 'joyzone'); const j = this.joyEl = h('div', 'joy'); j.appendChild(h('i')); r.append(z, j); this.zone = z;
      this.btnEl = {};
      for (const [k, label, bit, cls] of [['shoot', 'ŞUT', BTN.SHOOT, 'b-shoot'], ['pass', 'PAS', BTN.PASS, 'b-pass'], ['skill', 'KAYMA & YETENEK', BTN.TACKLE, 'b-skill']]) {
        const b = h('button', 'abtn ' + cls, label); b.dataset.bit = bit; b.dataset.k = k; this.btnEl[k] = b; r.appendChild(b);
      }
      this.touchMode = true;
    } else if (!this.spec) {
      const help = h('div', 'khelp');
      help.innerHTML = 'WASD / OK TUŞLARI: hareket · BOŞLUK: şut (basılı tut = güçlü) · E: pas · Q: kayma &amp; yetenek (topla: yetenek, topsuz: kayma)';
      r.appendChild(help); this.help = help; setTimeout(() => help.classList.add('fade'), 9000);
    } else r.appendChild(h('div', 'khelp', 'İZLEYİCİ MODU'));
    this.root.appendChild(r);
    this.resize();
  }

  // ---------- oyun içi paneller ----------
  panel(kind) {
    const same = this.panelKind === kind;
    this.closePanel();
    if (same) return;
    this.panelKind = kind;
    const box = this.pbox = h('div', 'mpanel'), body = this.pbody = h('div', 'mpb');
    const x = h('button', 'btn ghost xs', 'KAPAT'); x.type = 'button'; x.onclick = () => { audio.click(); this.closePanel(); };
    box.append(h('div', 'mph', h('b', null, { settings: 'AYARLAR', chat: 'ODA SOHBETİ', emoji: 'EMOJİ', quick: 'HIZLI SOHBET' }[kind]), x), body);
    box.addEventListener('pointerdown', (e) => e.stopPropagation());
    this.el.appendChild(box);
    if (kind === 'chat') this.drawChatPanel(); else if (kind === 'settings') this.drawSettingsPanel(); else if (kind === 'emoji') this.drawEmojiPanel(); else this.drawQuickPanel();
  }
  closePanel() { if (this.pbox) { this.pbox.remove(); this.pbox = null; } this.panelKind = ''; }
  say(text) { this.net.send({ t: 'chat.send', ch: 'room', text }); }
  drawQuickPanel() {
    const b = this.pbody;
    for (const t of ['Good playing', 'Thanks', 'Sorry my bad']) { const k = h('button', 'btn blue block', t); k.type = 'button'; k.onclick = () => { audio.click(); this.say(t); this.closePanel(); }; b.appendChild(k); }
  }
  drawEmojiPanel() {
    const inv = (this.cbs.app && this.cbs.app.me && this.cbs.app.me.inv) || [], g = h('div', 'egrid');
    EMOJIS.forEach((e, i) => {
      const own = FREE_EMOJIS.includes(i) || inv.includes('emo' + i);
      const k = h('button', 'eb' + (own ? '' : ' lock'), e); k.type = 'button'; k.disabled = !own;
      k.onclick = () => { audio.click(); this.net.send({ t: 'emote', e: i }); this.closePanel(); };
      g.appendChild(k);
    });
    this.pbody.append(g, h('div', 'dim sm', 'Kilitli emojiler Mağaza\'dan alınır.'));
  }
  drawChatPanel() {
    const b = this.pbody; if (!b) return;
    let log = b.querySelector('.mlog');
    if (!log) {
      log = h('div', 'mlog');
      const inp = h('input'); inp.type = 'text'; inp.maxLength = 140; inp.placeholder = 'Mesaj yaz…'; inp.enterKeyHint = 'send';
      const go = () => { const v = inp.value.trim(); if (v) { this.say(v); inp.value = ''; } };
      inp.onkeydown = (e) => { if (e.key === 'Enter') go(); };
      const sb = h('button', 'btn blue', 'GÖNDER'); sb.type = 'button'; sb.onclick = go;
      const row = h('div', 'mrowin'); row.append(inp, sb);
      b.append(log, row);
    }
    log.replaceChildren(...this.chatLog.map((m) => { const d = h('div', 'mm'); const n = h('b', null, m.from + ': '); d.append(n, document.createTextNode(m.text)); return d; }));
    log.scrollTop = log.scrollHeight;
  }
  drawSettingsPanel() {
    const b = this.pbody, st = settings.get();
    const range = (label, key) => { const l = h('label', 'srow'), i = h('input'); i.type = 'range'; i.min = 0; i.max = 100; i.value = st[key]; i.oninput = () => settings.set({ [key]: Number(i.value) }); l.append(h('span', null, label), i); return l; };
    const seg = (items, get, set) => { const sg = h('div', 'seg'); const bs = items.map(([v, lb]) => { const k = h('button', null, lb); k.type = 'button'; k.onclick = () => { audio.click(); set(v); mark(); }; sg.appendChild(k); return k; }); const mark = () => bs.forEach((k, i) => k.classList.toggle('on', items[i][0] === get())); mark(); return sg; };
    b.append(range('Ses efektleri', 'sfx'), range('Müzik', 'music'),
      h('div', 'lbl', 'Grafik'), seg([[0, 'DÜŞÜK'], [1, 'ORTA'], [2, 'YÜKSEK']], () => settings.get().gfx, (v) => settings.set({ gfx: v })),
      h('div', 'lbl', 'FPS ve MS göstergesi'), seg([[false, 'KAPALI'], [true, 'AÇIK']], () => settings.get().meter, (v) => settings.set({ meter: v })));
    if (this.touchMode && this.cbs.app) { const k = h('button', 'btn gold block', 'TUŞLARI DÜZENLE'); k.type = 'button'; k.onclick = () => { audio.click(); this.closePanel(); require("src/client/tabs/settings.js").controlsEditor(this.cbs.app); }; b.appendChild(k); }
  }

  resize() {
    const w = this.el.clientWidth || innerWidth, hh = this.el.clientHeight || innerHeight, L = this.L;
    const dpr = Math.min(devicePixelRatio || 1, 2);
    this.portrait = hh > w * 1.05;
    const fit = Math.min(w / L.VW, hh / L.VH);
    const big = !this.portrait && fit < 0.85;            // büyük saha (7v7 ve üstü / küçük ekran): yatayda da kamera
    this.camMode = this.portrait || big;
    if (this.portrait) {
      // dikey: sahne 90° döndürülür, kamera oyuncuyu / topu izler; tam sayı piksel ölçeği
      const PH0 = L.VH - L.HUD, k = Math.max(1, Math.round(w * dpr / (PH0 * 0.8)));
      this.vw = Math.floor(w * dpr / k); this.vh = Math.floor(hh * dpr / k);
      this.cv.width = this.vw * k; this.cv.height = this.vh * k;
      this.cv.style.width = this.cv.width / dpr + 'px'; this.cv.style.height = this.cv.height / dpr + 'px';
      this.HL = { VW: this.vw, HUD: L.HUD, oy: L.HUD, H: (this.vh - L.HUD) * 2 };
      this.qW = L.VH - L.HUD; this.qH = L.VW;
    } else if (big) {
      const k = Math.max(1, Math.round(hh * dpr / 260));
      this.vw = Math.floor(w * dpr / k); this.vh = Math.floor(hh * dpr / k);
      this.cv.width = this.vw * k; this.cv.height = this.vh * k;
      this.cv.style.width = this.cv.width / dpr + 'px'; this.cv.style.height = this.cv.height / dpr + 'px';
      this.HL = { VW: this.vw, HUD: L.HUD, oy: L.HUD, H: (this.vh - L.HUD) * 2 };
      this.qW = L.VW; this.qH = L.VH - L.HUD;
    } else {
      let s = Math.min(w / L.VW, hh / L.VH);
      if (s >= 2) s = Math.floor(s);
      this.vw = L.VW; this.vh = L.VH; this.HL = L;
      this.cv.style.width = Math.floor(L.VW * s) + 'px'; this.cv.style.height = Math.floor(L.VH * s) + 'px';
      this.cv.width = Math.floor(L.VW * s * dpr); this.cv.height = Math.floor(L.VH * s * dpr);
    }
    this.v = px.canvas(this.vw, this.vh); this.vc = this.v.getContext('2d'); this.vc.imageSmoothingEnabled = false;
    this.ctx.imageSmoothingEnabled = false;
    this.scale = this.cv.width / this.vw;
    this.camInit = false; this.pitchSet = {};
    const rc = this.cv.getBoundingClientRect();
    const top = (this.el.clientHeight - rc.height) / 2 + this.HL.HUD * (rc.height / this.vh) + 4;
    this.mtop.style.top = Math.max(4, top) + 'px';
    this.applyControls();
  }

  // dokunmatik kontrollerin konum / boyut / saydamlığı (ayarlardaki düzenlemeden, yöne göre)
  applyControls() {
    if (!this.touchMode) return;
    const c = settings.ctl(this.portrait ? 'portrait' : 'landscape'), W = this.el.clientWidth || innerWidth, H = this.el.clientHeight || innerHeight;
    const put = (e, p, sz, op) => { e.style.width = e.style.height = sz + 'px'; e.style.left = p.x * W + 'px'; e.style.top = p.y * H + 'px'; e.style.opacity = op; };
    this.joyHome = { x: c.joy.x * W, y: c.joy.y * H }; this.joySize = settings.JOY_BASE * c.joy.s; this.joyOp = c.joy.o;
    if (!this.joy) put(this.joyEl, c.joy, this.joySize, c.joy.o);
    for (const k of Object.keys(this.btnEl)) put(this.btnEl[k], c[k], settings.BTN_BASE * c[k].s, c[k].o);
  }

  // ---------- görünüm dönüşümü (yatay / dikey) ----------
  getPitch(frame) {
    const mode = this.portrait ? 'p' : this.camMode ? 'c' : 'l', key = mode + frame;
    if (!this.pitchSet[key]) {
      let cv = this.pitchSet['l' + frame];
      if (!cv) { const g = settings.get(); cv = this.pitchSet['l' + frame] = renderPitch(this.L, this.st.GW, { gfx: g.gfx, fans: !g.hideFans, frame, turf: this.design.turf | 0, post: this.design.post | 0 }); }
      this.pitchSet[key] = this.portrait ? rotatePitch(cv, this.L, this.myTeam) : this.camMode ? cropPitch(cv, this.L) : cv;
    }
    return this.pitchSet[key];
  }
  // sahne (yatay sanal) koordinatı -> ekran sanal pikseli
  projL(lx, ly) {
    const P = this.P, L = this.L;
    if (!this.camMode) { P.x = lx; P.y = ly + L.HUD; return P; }
    const q = this.qraw(lx, ly);
    P.x = q.x - this.cam.x; P.y = q.y - this.cam.y + L.HUD;
    return P;
  }
  qraw(lx, ly) {
    const L = this.L, o = this.Q || (this.Q = { x: 0, y: 0 });
    if (!this.portrait) { o.x = lx; o.y = ly; }
    else if (this.myTeam === 0) { o.x = ly; o.y = L.VW - lx; } else { o.x = L.VH - L.HUD - ly; o.y = lx; }
    return o;
  }
  proj(X, Y) { return this.projL(this.L.ox + X / 2, this.L.MY + Y / 2); }
  rotv(dx, dy) { const o = this.RV; if (!this.portrait) { o.x = dx; o.y = dy; } else if (this.myTeam === 0) { o.x = dy; o.y = -dx; } else { o.x = -dy; o.y = dx; } return o; }
  rotAng(a) { return !this.portrait ? a : this.myTeam === 0 ? a - Math.PI / 2 : a + Math.PI / 2; }

  updateCamera(dt) {
    const L = this.L, PW0 = this.qW, PH0 = this.qH, vw = this.vw, playH = this.vh - L.HUD;
    const mq = this.haveMe ? this.qraw(L.ox + (this.me.x + this.err.x) / 2, L.MY + (this.me.y + this.err.y) / 2) : this.qraw(L.ox + this.vb.x / 2, L.MY + this.vb.y / 2);
    const mx = mq.x, my = mq.y;
    const bq = this.qraw(L.ox + this.vb.x / 2, L.MY + this.vb.y / 2), bx = bq.x, by = bq.y;
    const cl = (v, a, b) => (v < a ? a : v > b ? b : v);
    let tx = mx + (bx - mx) * 0.3 - vw / 2, ty = my + (by - my) * 0.45 - playH / 2;
    tx = cl(tx, mx - vw * 0.82, mx - vw * 0.18); ty = cl(ty, my - playH * 0.85, my - playH * 0.15);
    tx = vw >= PW0 ? (PW0 - vw) / 2 : cl(tx, 0, PW0 - vw); ty = playH >= PH0 ? (PH0 - playH) / 2 : cl(ty, 0, PH0 - playH);
    const f = this.camF;
    if (!this.camInit) { f.x = tx; f.y = ty; this.camInit = true; } else { const k = 1 - Math.exp(-dt * 7); f.x += (tx - f.x) * k; f.y += (ty - f.y) * k; }
    this.cam.x = Math.round(f.x); this.cam.y = Math.round(f.y);
  }

  bind() {
    this.onKd = (e) => {
      if (this.spec || (e.target && /^(INPUT|TEXTAREA)$/.test(e.target.tagName))) return;
      if (e.repeat) { if (this.isGameKey(e)) e.preventDefault(); return; }
      audio.unlock();
      if (this.isGameKey(e)) { this.keys.add(e.code); e.preventDefault(); }
    };
    this.onKu = (e) => { this.keys.delete(e.code); };
    this.onBlur = () => { this.keys.clear(); this.tbtn = 0; };
    this.onRs = () => this.resize();
    addEventListener('keydown', this.onKd); addEventListener('keyup', this.onKu); addEventListener('blur', this.onBlur); addEventListener('resize', this.onRs);
    if (this.touchMode) {
      const z = this.zone;
      z.addEventListener('pointerdown', (e) => {
        audio.unlock();
        if (this.joy) return;
        z.setPointerCapture(e.pointerId);
        this.joy = { id: e.pointerId, bx: e.clientX, by: e.clientY, x: 0, y: 0 };
        const j = this.joyEl, rc = this.el.getBoundingClientRect(); j.style.left = e.clientX - rc.left + 'px'; j.style.top = e.clientY - rc.top + 'px'; j.classList.add('on'); j.style.opacity = Math.min(1, this.joyOp + 0.2);
        j.firstChild.style.transform = 'translate(0px,0px)';
      });
      z.addEventListener('pointermove', (e) => {
        const j = this.joy; if (!j || e.pointerId !== j.id) return;
        let dx = e.clientX - j.bx, dy = e.clientY - j.by; const R = this.joySize * 0.4, m = Math.hypot(dx, dy);
        if (m > R) { dx = dx / m * R; dy = dy / m * R; }
        j.x = dx / R; j.y = dy / R;
        this.joyEl.firstChild.style.transform = 'translate(' + dx + 'px,' + dy + 'px)';
      });
      const end = (e) => { const j = this.joy; if (!j || e.pointerId !== j.id) return; this.joy = null; this.joyEl.classList.remove('on'); this.joyEl.firstChild.style.transform = ''; this.applyControls(); };
      z.addEventListener('pointerup', end); z.addEventListener('pointercancel', end);
      for (const k of Object.keys(this.btnEl)) {
        const b = this.btnEl[k], bit = +b.dataset.bit;
        b.addEventListener('pointerdown', (e) => { e.preventDefault(); audio.unlock(); b.setPointerCapture(e.pointerId); this.tbtn |= bit; b.classList.add('on'); });
        const up = (e) => { e.preventDefault(); this.tbtn &= ~bit; b.classList.remove('on'); };
        b.addEventListener('pointerup', up); b.addEventListener('pointercancel', up);
      }
    }
  }

  isGameKey(e) {
    return /^(Key[WASDEQKJ]|Arrow(Up|Down|Left|Right)|Space)$/.test(e.code);
  }

  // ---------- ağ ----------
  onBin(u8) {
    if (this.dead) return;
    const s = proto.decodeSnap(u8, this.pool[this.pi++ % POOL]);
    if (!s) return;
    const now = performance.now();
    s.at = now; s.tms = s.tick * STEP_MS;
    const sn = this.sn;
    if (sn.length && s.tick <= sn[sn.length - 1].tick) return;          // eski / tekrar
    sn.push(s); while (sn.length > POOL - 2) sn.shift();
    this.offWin.push(now - s.tms); if (this.offWin.length > 40) this.offWin.shift();
    let mn = Infinity; for (let i = 0; i < this.offWin.length; i++) if (this.offWin[i] < mn) mn = this.offWin[i];
    this.off = this.off === null ? mn : this.off + (mn - this.off) * 0.15;
    this.reconcile(s, now);
  }

  onGoal(m) {
    setTimeout(() => {                         // görüntü gecikmesiyle senkron göster
      if (this.dead) return;
      this.lastGoalFx = this.roster[m.scorer] ? (this.roster[m.scorer].card.look.gf | 0) : 0;
      const sc = this.roster[m.scorer], as = m.assist >= 0 ? this.roster[m.assist] : null;
      this.banner = { t0: performance.now(), text: m.og ? 'KENDİ KALESİNE' : 'GOL!', sub: sc ? sc.name + (as ? '  (' + as.name + ')' : '') : '', team: m.team };
      this.celebrateTeam = m.og ? -1 : m.team; this.celebrateT = performance.now();
      this.shake = 7; audio.goal();
      this.confetti(m.team, this.lastGoalFx);
      this.feed.unshift({ t0: performance.now(), text: (sc ? sc.name : '?') + (m.og ? ' (KK)' : ''), team: m.team });
      this.feed.length = Math.min(this.feed.length, 3);
    }, INTERP_MS);
  }

  // ---------- tahmin + uzlaştırma ----------
  reconcile(s, now) {
    const ps = s.players[this.you];
    if (!ps) return;
    let ack = -1;
    for (const a of s.acks) if (a[0] === this.you) { ack = a[1]; break; }
    const hist = this.hist;
    if (ack >= 0) while (hist.length && ((ack - hist[0].seq) & 0xffff) < 0x8000) hist.shift();
    const ctl = !(ps.flags & 6) && s.phase !== PHASE.WAIT && s.phase !== PHASE.END;
    const t = { x: ps.x, y: ps.y, vx: ps.vx, vy: ps.vy, stamina: 1, sprinting: false, dir: ps.dir, d: this.me.d };
    if (ctl) {
      for (let i = 0; i < hist.length; i++) {
        const e = hist[i];
        let dur = ((i + 1 < hist.length ? hist[i + 1].t : now) - e.t) / 1000;
        while (dur > 0) { const c = Math.min(dur, 0.04); movePlayer(t, e.ax, e.ay, e.sprint, c, this.W, this.H); dur -= c; }
      }
    }
    const me = this.me;
    if (!this.haveMe) { Object.assign(me, t); this.haveMe = true; return; }
    const dx = t.x - me.x, dy = t.y - me.y, d = Math.hypot(dx, dy);
    if (!ctl || d > 70) { Object.assign(me, t); this.err.x = this.err.y = 0; }
    else if (d > 2.5) { this.err.x += me.x - t.x; this.err.y += me.y - t.y; me.x = t.x; me.y = t.y; me.vx = t.vx; me.vy = t.vy; }
    else { me.x += dx * 0.3; me.y += dy * 0.3; }
  }

  // ---------- girdi ----------
  readInput() {
    const k = this.keys, o = this.inp;
    let ax = 0, ay = 0, btn = 0;
    if (k.has('KeyA') || k.has('ArrowLeft')) ax -= 1;
    if (k.has('KeyD') || k.has('ArrowRight')) ax += 1;
    if (k.has('KeyW') || k.has('ArrowUp')) ay -= 1;
    if (k.has('KeyS') || k.has('ArrowDown')) ay += 1;
    if (k.has('Space')) btn |= BTN.SHOOT;
    if (k.has('KeyE') || k.has('KeyK')) btn |= BTN.PASS;
    if (k.has('KeyQ') || k.has('KeyJ')) btn |= BTN.TACKLE;
    if (this.joy) { ax += this.joy.x; ay += this.joy.y; }
    btn |= this.tbtn;
    if (this.portrait) { const sx = ax, sy = ay; if (this.myTeam === 0) { ax = -sy; ay = sx; } else { ax = sy; ay = -sx; } }   // ekran yönü -> dünya yönü
    const m = Math.hypot(ax, ay); if (m > 1) { ax /= m; ay /= m; }
    if (m < 0.12) { ax = 0; ay = 0; }
    o.ax = Math.round(ax * 127) / 127; o.ay = Math.round(ay * 127) / 127; o.btn = btn;
    return o;
  }

  sendInput(now, inp) {
    const l = this.lastSent;
    if (inp.ax === l.ax && inp.ay === l.ay && inp.btn === l.btn && now - this.lastSendAt < SEND_MS) return;
    this.seq = (this.seq + 1) & 0xffff;
    this.hist.push({ seq: this.seq, t: now, ax: inp.ax, ay: inp.ay, sprint: now < this.skillUntil });
    if (this.hist.length > 120) this.hist.shift();
    this.net.sendBin(proto.encodeInput(this.seq, inp.ax, inp.ay, inp.btn));
    const ls = this.lastSent; ls.ax = inp.ax; ls.ay = inp.ay; ls.btn = inp.btn; this.lastSendAt = now;
  }

  // ---------- enterpolasyon ----------
  sample(rt) {
    const sn = this.sn, n = sn.length;
    if (!n) return false;
    let a = sn[0], b = sn[0];
    if (rt >= sn[n - 1].tms) { a = b = sn[n - 1]; }
    else if (rt > sn[0].tms) { for (let i = n - 1; i > 0; i--) if (sn[i - 1].tms <= rt) { a = sn[i - 1]; b = sn[i]; break; } }
    let f = b.tms > a.tms ? (rt - a.tms) / (b.tms - a.tms) : 1;
    f = f < 0 ? 0 : f > 1 ? 1 : f;
    let ex = 0;
    if (a === b && rt > b.tms) ex = Math.min(0.12, (rt - b.tms) / 1000);             // veri yetmezse kısa öngörü
    for (let i = 0; i < this.n; i++) {
      const pa = a.players[i], pb = b.players[i], o = this.vp[i];
      o.x = lerp(pa.x, pb.x, f) + pb.vx * ex; o.y = lerp(pa.y, pb.y, f) + pb.vy * ex;
      o.vx = pb.vx; o.vy = pb.vy; o.dir = lerpAng(pa.dir, pb.dir, f); o.flags = f < 0.5 ? pa.flags : pb.flags; o.stam = pb.stam;
    }
    const ba = a.ball, bb = b.ball, vb = this.vb;
    vb.x = lerp(ba.x, bb.x, f) + bb.vx * ex; vb.y = lerp(ba.y, bb.y, f) + bb.vy * ex; vb.vx = bb.vx; vb.vy = bb.vy; vb.owner = bb.owner;
    const w = f < 0.5 ? a : b, v = this.view;
    v.phase = w.phase; v.clock = w.clock; v.s0 = w.s0; v.s1 = w.s1; v.golden = w.golden; v.phaseT = w.phaseT;
    // olayları (ses) kendi zamanında tetikle
    for (let i = 0; i < n; i++) {
      const s = sn[i];
      if (s.tms <= rt && s.tick > this.firedTick) { this.firedTick = s.tick; if (s.ev) this.fireEvents(s.ev, s); }
    }
    return true;
  }

  fireEvents(ev, s) {
    const b = s.ball;
    if (ev & EV.KICK) { audio.kick(); this.burst(b.x, b.y, 5, '#ffffff', 40); }
    if (ev & EV.POST) { audio.post(); this.shake = Math.max(this.shake, 2); this.burst(b.x, b.y, 6, '#ffe9a6', 60); }
    if (ev & EV.WALL) audio.wall();
    if (ev & EV.SAVE) audio.save();
    if (ev & EV.WHISTLE) { if (s.phase === PHASE.END) audio.final(); else { audio.whistle(); if (s.phase === PHASE.PLAY) this.startFlash = performance.now(); } }
  }

  // ---------- efektler ----------
  burst(x, y, n, col, sp) {
    if (this.gfx === 0) n = Math.ceil(n / 3);
    if (this.fx.length > 320) return;
    for (let i = 0; i < n; i++) {
      const a = Math.random() * 6.283, s = (0.3 + Math.random()) * sp / 2;
      this.fx.push({ x: this.L.ox + x / 2, y: this.L.MY + y / 2, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0.3 + Math.random() * 0.25, max: 0.55, col, sz: 1, g: 0 });
    }
  }
  confetti(team, gf) {
    const k = this.kits[team], fc = gf > 0 && GOAL_FX[gf] ? GOAL_FX[gf][1] : null, cols = fc ? [fc, '#ffffff', fc, k[0]] : [k[0], k[1], '#ffd75a', '#ffffff'];
    const n = (this.gfx === 0 ? 20 : this.gfx === 1 ? 45 : 70) * (fc ? 1.6 : 1) | 0;
    for (let i = 0; i < n; i++) {
      this.fx.push({ scr: true, x: Math.random() * this.vw, y: this.HL.HUD - Math.random() * 40, vx: (Math.random() - 0.5) * 30, vy: 30 + Math.random() * 60,
        life: 1.8 + Math.random(), max: 2.8, col: cols[i % 4], sz: 2, g: 20 });
    }
  }

  // ---------- ana döngü ----------
  frame(ts) {
    if (this.dead) return;
    this.raf = requestAnimationFrame((t) => this.frame(t));
    const now = performance.now(), fps = settings.get().fps;
    if (fps && now - this.last < 1000 / fps - 3) return;          // sabit FPS sınırı
    const dt = Math.min(0.05, (now - this.last) / 1000); this.last = now;
    const inp = this.readInput();
    if (!this.spec) {
      if ((inp.btn & BTN.TACKLE) && !(this.prevBtn & BTN.TACKLE) && this.vb.owner === this.you && now >= this.skillCd) { this.skillUntil = now + 380; this.skillCd = now + 1600; }
      this.prevBtn = inp.btn;
    }
    if (this.st && !this.ended && !this.spec) this.sendInput(now, inp);
    this.update(dt, inp, now);
    this.draw(now, dt);
  }

  update(dt, inp, now) {
    // yerel tahmin
    const phase = this.view.phase, me = this.me;
    if (this.haveMe && phase !== PHASE.WAIT && phase !== PHASE.END) {
      const stunned = this.vp[this.you] && (this.vp[this.you].flags & 6);
      if (!stunned) movePlayer(me, inp.ax, inp.ay, now < this.skillUntil, dt, this.W, this.H);
    }
    const k = Math.exp(-dt * 11); this.err.x *= k; this.err.y *= k;
    // şut şarjı göstergesi
    if (inp.btn & BTN.SHOOT) { this.charge = Math.min(1, this.charge + dt / 0.6); this.chargeOn = true; } else { this.charge = 0; this.chargeOn = false; }
    if (this.off !== null) this.sample(now - this.off - INTERP_MS);
    // top: bende ise ayağımda çiz (gecikme gizleme)
    const s = this.sn[this.sn.length - 1], vb = this.vb;
    const mine = s && s.ball.owner === this.you && this.haveMe && !(this.vp[this.you] && (this.vp[this.you].flags & 6));
    this.dribble = Math.max(0, Math.min(1, this.dribble + (mine ? dt / 0.12 : -dt / 0.12)));
    if (this.dribble > 0) {
      const o = PR * me.d.reach + BR + 1, tx = me.x + this.err.x + Math.cos(me.dir) * o, ty = me.y + this.err.y + Math.sin(me.dir) * o;
      vb.x = lerp(vb.x, tx, this.dribble); vb.y = lerp(vb.y, ty, this.dribble);
    }
    const lb = this.lastBall || (this.lastBall = { x: vb.x, y: vb.y });
    this.ballRoll += Math.hypot(vb.x - lb.x, vb.y - lb.y); lb.x = vb.x; lb.y = vb.y;
    // animasyon saatleri
    for (let i = 0; i < this.n; i++) {
      const p = i === this.you && this.haveMe ? me : this.vp[i];
      this.anim[i] += dt * (0.4 + Math.hypot(p.vx, p.vy) * 0.045);
    }
    // parçacıklar
    const fxs = this.fx; let nf = 0;
    for (let i = 0; i < fxs.length; i++) {
      const f = fxs[i]; f.life -= dt;
      if (f.life <= 0) continue;
      f.vy += f.g * dt; f.x += f.vx * dt; f.y += f.vy * dt; fxs[nf++] = f;
    }
    fxs.length = nf;
    if (this.shake > 0) this.shake = Math.max(0, this.shake - dt * 14);
    if (this.view.phase === PHASE.END && !this.ended) { this.ended = true; }
    if (this.camMode) this.updateCamera(dt);
    // yetenek atılımı: toz; şut efekti: topun arkasında iz
    if (this.haveMe && now < this.skillUntil && this.gfx > 0 && Math.random() < 0.6) this.burst(me.x - Math.cos(me.dir) * 8, me.y + 6, 1, '#cfd8c0', 12);
    if (vb.owner >= 0) { this.lastOwner = vb.owner; const rr = this.roster[vb.owner]; this.ballSkin = rr ? rr.card.look.bl | 0 : 0; }
    const lo = this.roster[this.lastOwner], sfx = lo && SHOT_FX[lo.card.look.sf | 0];
    if (sfx && sfx[1] && this.gfx > 0 && this.fx.length < 260 && Math.hypot(vb.vx, vb.vy) > 220) {
      this.fx.push({ x: this.L.ox + vb.x / 2, y: this.L.MY + vb.y / 2, vx: 0, vy: 0, life: 0.35, max: 0.5, col: sfx[1], sz: 2, g: 0 });
    }
  }

  teamLabel(t) {
    const hum = this.roster.find((r) => r.team === t && !r.bot && r.clan);
    if (this.st.kind === 'clan' && this.st.clans && this.st.clans[t]) return this.st.clans[t];
    if (hum && this.roster.filter((r) => r.team === t && !r.bot).every((r) => r.clan === hum.clan)) return hum.clan;
    return t === 0 ? 'TAKIM A' : 'TAKIM B';
  }

  drawPlayer(c, i, now) {
    const r = this.roster[i], mineP = i === this.you && this.haveMe;
    const p = mineP ? this.me : this.vp[i];
    const fl = (mineP ? (this.vp[i].flags & 6) ? this.vp[i].flags : 0 : this.vp[i].flags);
    const X = mineP ? p.x + this.err.x : p.x, Y = mineP ? p.y + this.err.y : p.y;
    const PP = this.proj(X, Y); let x = Math.round(PP.x), y = Math.round(PP.y);
    const gk = r.slot === 0, kit = gk ? px.GK_KITS[r.team] : this.kits[r.team];
    const sp = Math.hypot(p.vx, p.vy);
    let dir = px.dirIndex(this.rotAng(mineP && sp > 20 ? me_dir(this) : p.dir)), frame = 0;
    if (sp > 22) frame = [0, 1, 2, 3][Math.floor(this.anim[i]) & 3];
    const vflags = this.vp[i].flags;
    if (vflags & 16) frame = 4;
    if (vflags & 32) frame = 7;
    const cel = this.celebrateTeam === r.team && now - this.celebrateT < 2600;
    let yo = 0;
    if (cel) { frame = 7; yo = -Math.abs(Math.round(Math.sin((now - this.celebrateT) / 110 + i) * 3)); }
    if (this.gfx > 0) { c.fillStyle = 'rgba(0,0,0,0.28)'; c.fillRect(x - 6, y + 2, 12, 3); c.fillRect(x - 5, y + 5, 10, 1); }
    const hq = this.gfx >= 1, spr = this.sprFor(r, kit, gk, dir, frame, hq);
    if (fl & 2 || (this.vp[i].flags & 2)) {                                    // kayarak müdahale: yatık sprite
      const rv = this.rotv(p.vx, p.vy), pos = rv.x >= 0;
      c.save(); c.translate(x, y + 1); c.rotate(pos ? Math.PI / 2 : -Math.PI / 2);
      c.drawImage(this.sprFor(r, kit, gk, pos ? 1 : 3, 1, hq), hq ? -9 : -8, hq ? -13 : -12); c.restore();
      if (Math.random() < 0.5) this.burst(X, Y + 6, 1, '#d9cfa8', 18);
    } else c.drawImage(spr, x - (hq ? 9 : 8), y - (hq ? 16 : 15) + yo);
    if (this.vp[i].flags & 4) {                                                // sersemledi: dönen yıldızlar
      const a = now / 120; c.fillStyle = '#ffd75a';
      for (let q = 0; q < 3; q++) c.fillRect(Math.round(x + Math.cos(a + q * 2.1) * 6), Math.round(y - 17 + Math.sin(a + q * 2.1) * 2), 2, 2);
    }
    const col = r.team === 0 ? this.kits[0][0] : this.kits[1][0];
    if (i === this.you) {
      const bob = Math.round(Math.sin(now / 160) * 1);
      c.fillStyle = '#000'; c.fillRect(x - 3, y - 29 + bob, 7, 1); c.fillRect(x - 2, y - 28 + bob, 5, 1); c.fillRect(x - 1, y - 27 + bob, 3, 1); c.fillRect(x, y - 26 + bob, 1, 1);
      c.fillStyle = '#ffd75a'; c.fillRect(x - 2, y - 29 + bob, 5, 1); c.fillRect(x - 1, y - 28 + bob, 3, 1); c.fillRect(x, y - 27 + bob, 1, 1);
      px.drawText(c, r.name.slice(0, 9), x, y - 38, '#ffd75a', 1, { align: 'c', shadow: '#000' });
      if (this.chargeOn) { c.fillStyle = 'rgba(0,0,0,0.55)'; c.fillRect(x - 8, y + 7, 16, 3); c.fillStyle = this.charge > 0.85 ? '#ff5a3c' : '#ffd75a'; c.fillRect(x - 7, y + 8, Math.round(14 * this.charge), 1); }
    } else {
      px.drawText(c, (r.bot ? '' : '') + r.name.slice(0, 9), x, y - 24, r.team === this.myTeam ? '#dff6ff' : '#ffd7d2', 1, { align: 'c', shadow: '#000' });
    }
    void col;
    const bb = this.bub[i];
    if (bb) {
      const age = (now - bb.t0) / 1000;
      if (age > 3.6) this.bub[i] = null;
      else {
        const by = y - (i === this.you ? 50 : 38);
        c.globalAlpha = age > 3 ? Math.max(0, 1 - (age - 3) / 0.6) : 1;
        if (bb.e) { c.font = '13px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillStyle = '#fff'; c.fillText(bb.e, x, by); }
        else { const w = px.textWidth(bb.text, 1) + 8; c.fillStyle = '#fff'; c.fillRect(x - (w >> 1), by - 7, w, 12); c.fillRect(x - 1, by + 5, 3, 2); px.drawText(c, bb.text, x, by - 4, '#111', 1, { align: 'c' }); }
        c.globalAlpha = 1;
      }
    }
  }

  // oyuncu sprite'ı: kayıt başına önbellek (dir/kare/kalite değişmedikçe aynı nesne)
  sprFor(r, kit, gk, dir, frame, hq) {
    const k = r._k || (r._k = { d: -1, f: -1, q: -1, s: null, kit: null });
    if (k.d === dir && k.f === frame && k.q === hq && k.kit === kit) return k.s;
    k.d = dir; k.f = frame; k.q = hq; k.kit = kit;
    return (k.s = hq ? px.playerSpriteHQ(r.card.look, kit, gk, dir, frame) : px.playerSprite(r.card.look, kit, gk, dir, frame));
  }

  draw(now, dt) {
    const c = this.vc, L = this.L, fans = !settings.get().hideFans;
    const frame = this.gfx >= 2 && fans && this.mode < 9 ? (Math.floor(now / 450) & 1) : 0, pit = this.getPitch(frame);
    if (this.camMode) { c.fillStyle = '#2c3b66'; c.fillRect(0, 0, this.vw, this.vh); c.drawImage(pit, -this.cam.x, L.HUD - this.cam.y); } else c.drawImage(pit, 0, 0);
    if (this.sn.length) {
      const items = this.items;
      for (let i = 0; i < this.n; i++) {
        const mineP = i === this.you && this.haveMe;
        const X = mineP ? this.me.x + this.err.x : this.vp[i].x, Y = mineP ? this.me.y + this.err.y : this.vp[i].y;
        const it = items[i] || (items[i] = { y: 0, i, ball: false });
        it.y = this.proj(X, Y).y; it.i = i; it.ball = false;
      }
      const bi = items[this.n] || (items[this.n] = { y: 0, i: -1, ball: true });
      bi.y = this.proj(this.vb.x, this.vb.y + 2).y; bi.ball = true; items.length = this.n + 1;
      items.sort((a, b) => a.y - b.y);
      for (const it of items) {
        if (it.ball) {
          const PB = this.proj(this.vb.x, this.vb.y), bx = Math.round(PB.x), by = Math.round(PB.y);
          if (this.gfx > 0) { c.fillStyle = 'rgba(0,0,0,0.3)'; c.fillRect(bx - 3, by + 2, 7, 2); }
          c.drawImage(px.ballSprite(Math.floor(this.ballRoll / 7), this.ballSkin), bx - 4, by - 5);
        } else this.drawPlayer(c, it.i, now);
      }
    }
    // parçacıklar
    for (let fi = 0; fi < this.fx.length; fi++) {
      const f = this.fx[fi];
      c.globalAlpha = Math.min(1, f.life / (f.max * 0.5)); c.fillStyle = f.col;
      if (f.scr) c.fillRect(Math.round(f.x), Math.round(f.y), f.sz, f.sz); else { const q = this.projL(f.x, f.y); c.fillRect(Math.round(q.x), Math.round(q.y), f.sz, f.sz); }
    }
    c.globalAlpha = 1;
    this.drawHud(c, now);
    // ekrana bas
    const ctx = this.ctx, s = this.scale;
    const sh = this.gfx > 0 ? this.shake : 0;
    const sx = sh > 0 ? Math.round((Math.random() - 0.5) * sh) * s : 0, sy = sh > 0 ? Math.round((Math.random() - 0.5) * sh) * s : 0;
    ctx.fillStyle = '#2c3b66'; ctx.fillRect(0, 0, this.cv.width, this.cv.height);
    ctx.drawImage(this.v, 0, 0, this.vw, this.vh, sx, sy, this.cv.width, this.cv.height);
  }

  drawHud(c, now) {
    const L = this.HL, v = this.view;
    const bd = this.board;
    c.fillStyle = bd.bg; c.fillRect(0, 0, L.VW, L.HUD);
    c.fillStyle = bd.ln; c.fillRect(0, L.HUD - 1, L.VW, 1);
    const cx = L.VW >> 1;
    // takım etiketleri
    for (const t of [0, 1]) {
      const label = this.teamLabel(t), k = this.kits[t];
      const w = px.textWidth(px.upper(label), 1) + 10;
      const x = t === 0 ? cx - 56 - w : cx + 56;
      c.fillStyle = k[0]; c.fillRect(x, 7, w, 12); c.fillStyle = k[1]; c.fillRect(x, 7, w, 1); c.fillRect(x, 18, w, 1);
      px.drawText(c, label, x + 5, 10, luma(k[0]) > 0.55 ? '#111' : '#fff', 1);
    }
    px.drawText(c, String(v.s0), cx - 30, 4, bd.tx, 2, { align: 'c', shadow: '#000' });
    px.drawText(c, ':', cx - 2, 4, bd.ln, 2, { align: 'c' });
    px.drawText(c, String(v.s1), cx + 26, 4, bd.tx, 2, { align: 'c', shadow: '#000' });
    const m = Math.floor(v.clock / 60), sc = v.clock % 60;
    px.drawText(c, v.golden ? 'ALTIN GOL' : m + ':' + String(sc).padStart(2, '0'), cx, 20, v.golden && ((now / 400) | 0) % 2 ? '#ffd75a' : '#9fb0d9', 1, { align: 'c' });
    // gol akışı
    let fy = L.HUD + 4;
    for (const f of this.feed) {

defs["src/client/localnet.js"]=function(module,exports,require){
'use strict';
/* Çevrimdışı mod: sunucudaki Hub'ın aynısı tarayıcıda çalışır. Hesaplar ve klanlar bu tarayıcının

const { MemoryStore } = require("src/server/store.js");

const { COUNTRIES, mulberry32, HAIRS, HAIR_STYLES, KITS, STRIPES, SKINS, POSITIONS } = require("src/core/consts.js");

const rd = () => { try { return localStorage.getItem(SKEY); } catch (e) { return null; } };
const wr = (s) => { try { localStorage.setItem(SKEY, s); } catch (e) { /* kota/izin yok */ } };

function cyrb(str) {                          // basit, geri döndürülemez özet (yalnızca demo)
  let h1 = 0xdeadbeef, h2 = 0x41c6ce57;
  for (let i = 0; i < str.length; i++) { const c = str.charCodeAt(i); h1 = Math.imul(h1 ^ c, 2654435761); h2 = Math.imul(h2 ^ c, 1597334677); }

  return (4294967296 * (2097151 & h2) + (h1 >>> 0)).toString(36);

class LocalStore extends MemoryStore {
  constructor() { super(); this.t = null; }
  load() {
    const raw = rd();
    if (raw) {
      try {
        const s = JSON.parse(raw);
        for (const u of s.users || []) { this.users.set(u.name.toLowerCase(), u); if (u.token) this.byToken.set(u.token, u); }

  }
  dump() {
    const docs = {};

    return JSON.stringify({ users: [...this.users.values()], clans: [...this.clans.values()], docs });
  }
  save() { if (this.t) return; this.t = setTimeout(() => { this.t = null; wr(this.dump()); }, 400); }
  putDoc(c, i, v) { super.putDoc(c, i, v); this.save(); }
  delDoc(c, i) { super.delDoc(c, i); this.save(); }
  putUser(u) { super.putUser(u); this.save(); }
  putClan(c) { super.putClan(c); this.save(); }
  delClan(t) { super.delClan(t); this.save(); }
  flushSync() { if (this.t) { clearTimeout(this.t); this.t = null; } wr(this.dump()); }

  seed() {
    const r = mulberry32(2026), pick = (a) => a[Math.floor(r() * a.length)];
    const names = ['KaraKartal', 'DemirPerde', 'GolKralı', 'PikselAslan', 'Fırtına', 'TurboCan', 'SessizOk', 'BozKurt', 'MaviYıldırım', 'Çelik34',

      'GeceKuşu', 'Atmaca', 'Kaplan61', 'Çınar', 'Doruk', 'Mavi_Kanat', 'Efe_Gol', 'Zeynep9', 'Kıvılcım', 'Demir_KL'];
    const clans = [['KRT', 'Kara Kartallar'], ['DMR', 'Demir Yumruk'], ['GCE', 'Gece Kuşları'], ['PXL', 'Piksel Aslanlar'], ['FRT', 'Mavi Fırtına']];
    const members = new Map(clans.map((c) => [c[0], []]));

        { skin: Math.floor(r() * SKINS.length), hs: Math.floor(r() * HAIR_STYLES.length), hc: Math.floor(r() * HAIRS.length), kit: Math.floor(r() * KITS.length), stripe: Math.floor(r() * STRIPES.length), no: 1 + Math.floor(r() * 98) });
      addXp(card, Math.floor(r() * r() * 9000));

      const tag = i < 26 ? clans[i % 5][0] : null;
      const cm = tag ? Math.floor(m * 0.4) : 0;

        country: r() < 0.7 ? 'TR' : pick(COUNTRIES)[0], friends: [], freq: [], blocked: [], muted: [], chatBan: 0,
        stats: { m, w, d, l: m - w - d, g: Math.floor(w * 1.6), a: Math.floor(w * 0.9), s: Math.floor(r() * 20), cs: Math.floor(r() * 8), cm, sm: m - cm, rm: Math.floor(m * 0.5) } };
      this.users.set(n.toLowerCase(), u); this.byToken.set(u.token, u);

    clans.forEach(([tag, name]) => {

    });

  }
}

let hub = null, seq = 0, loop = null;
function boot() {
  if (hub) return hub;
  const store = new LocalStore().load();
  let secs = 0;
  try { secs = +new URLSearchParams(location.search).get('secs') || 0; } catch (e) { /* yok say */ }   // ?secs=30 → kısa maç (demo/test)
  hub = new Hub({
    store, now: Date.now, queueSoloMs: 2500, queuePairMs: 2500, matchSeconds: secs > 0 ? Math.min(secs, 600) : undefined,
    hashPw: async (p) => 'o:' + cyrb('tuz' + p), verifyPw: async (p, h) => h === 'o:' + cyrb('tuz' + p),
    token: () => Array.from({ length: 4 }, () => Math.random().toString(36).slice(2)).join(''),
  });

  loop = setInterval(() => {
    const now = performance.now(); acc += Math.min(now - last, 250); slow += now - last; last = now;
    let n = 0;
    while (acc >= 25 && n < 6) { hub.step(); acc -= 25; n++; }
    if (acc > 200) acc = 0;
    if (slow >= 1000) { slow = 0; hub.slow(); }

}

function create() {
  const h = boot();
  const tr = { onopen: null, onmessage: null, onbinary: null, onclose: null, closed: false };
  const conn = {
    id: ++seq, ip: 'yerel',
    send(s) { if (!tr.closed) queueMicrotask(() => tr.onmessage && !tr.closed && tr.onmessage(s)); },
    sendBin(u) { if (!tr.closed) queueMicrotask(() => tr.onbinary && !tr.closed && tr.onbinary(u)); },
    canSend() { return true; },
    close() { if (!tr.closed) { tr.closed = true; h.disconnect(conn); queueMicrotask(() => tr.onclose && tr.onclose()); } },
  };

  tr.sendBin = (u) => { if (!tr.closed) h.onBin(conn, u); };
  tr.close = () => conn.close();
  setTimeout(() => tr.onopen && tr.onopen(), 0);
  void overall;
  return tr;
}

module.exports = { create };

};

defs["src/client/net.js"]=function(module,exports,require){
'use strict';
/* Ağ katmanı: tek arayüz, iki taşıma (WebSocket / tarayıcı içi yerel Hub).
   Otomatik yeniden bağlanma (artan bekleme), token ile oturum devamı, RTT ölçümü. */
const OFFLINE = false;
const local = require("src/client/localnet.js");

const KEY = 'pf_' + (OFFLINE ? 'o_' : 'w_') + 'token';
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { if (v == null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) { /* depolama yok */ } },
};

class Net {
  constructor() {
    this.h = new Map(); this.state = 'idle'; this.tr = null; this.token = store.get(KEY);
    this.rtt = 0; this.online = 0; this.tries = 0; this.want = false; this.onbin = null; this.timer = null; this.pingT = null;
    this.offline = OFFLINE;
  }

  on(t, fn) { let s = this.h.get(t); if (!s) this.h.set(t, (s = new Set())); s.add(fn); return () => s.delete(fn); }
  emit(t, m) { const s = this.h.get(t); if (s) for (const fn of [...s]) { try { fn(m); } catch (e) { console.error('[ağ] işleyici hatası', t, e); } } }

  connect() {
    this.want = true;
    if (this.tr) return;
    this.setState('connecting');
    let tr;
    if (OFFLINE) tr = local.create();
    else {
      const url = (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws';
      let ws;
      try { ws = new WebSocket(url); } catch (e) { this.retryLater(); return; }
      ws.binaryType = 'arraybuffer';
      tr = { ws, send: (s) => ws.send(s), sendBin: (u) => ws.send(u), close: () => ws.close() };
      ws.onopen = () => tr.onopen && tr.onopen();
      ws.onclose = () => tr.onclose && tr.onclose();
      ws.onerror = () => { /* onclose zaten gelir */ };
      ws.onmessage = (e) => { if (typeof e.data === 'string') tr.onmessage && tr.onmessage(e.data); else tr.onbinary && tr.onbinary(new Uint8Array(e.data)); };
    }
    this.tr = tr;
    tr.onopen = () => {
      this.tries = 0; this.setState('open');
      if (this.token) this.send({ t: 'resume', token: this.token });
      else this.emit('needlogin');
      clearInterval(this.pingT);
      this.pingT = setInterval(() => this.send({ t: 'ping', ts: performance.now() }), 2500);
    };
    tr.onmessage = (s) => {
      let m; try { m = JSON.parse(s); } catch (e) { return; }
      if (m.t === 'pong') { const r = performance.now() - m.ts; this.rtt = this.rtt ? this.rtt * 0.7 + r * 0.3 : r; if (m.n != null) this.online = m.n; }
      else if (m.t === 'auth') { this.token = m.token; store.set(KEY, m.token); if (m.online != null) this.online = m.online; }
      else if (m.t === 'err' && m.code === 'bad_token') { this.token = null; store.set(KEY, null); }
      else if (m.t === 'kicked' || m.t === 'bye') { this.want = false; }
      this.emit(m.t, m); this.emit('*', m);
    };
    tr.onbinary = (u) => { if (this.onbin) this.onbin(u); };
    tr.onclose = () => {
      clearInterval(this.pingT); this.tr = null; this.setState('closed');
      this.emit('close');
      if (this.want) this.retryLater();
    };
  }

  retryLater() {
    this.setState('closed');
    clearTimeout(this.timer);
    const d = Math.min(5000, 400 * Math.pow(1.7, this.tries++));
    this.timer = setTimeout(() => { if (this.want) { this.tr = null; this.connect(); } }, d);
  }

  setState(s) { if (this.state !== s) { this.state = s; this.emit('state', s); } }
  send(o) { if (this.tr && this.state === 'open') this.tr.send(JSON.stringify(o)); }
  sendBin(u) { if (this.tr && this.state === 'open') this.tr.sendBin(u); }

  logout() {
    this.token = null; store.set(KEY, null); this.want = false;
    clearTimeout(this.timer);
    if (this.tr) this.tr.close();
    this.tr = null; this.setState('idle');
  }
}

module.exports = { Net, store, OFFLINE };

};
defs["src/client/pitch.js"]=function(module,exports,require){
'use strict';
/* Saha: bir kez çizilen statik katman (çim, çizgiler, kaleler, reklam panoları) ve sahne ölçüleri.
   Sanal piksel: 1 sanal px = 2 dünya birimi. */
const { canvas } = require("src/client/pixel.js");
const { TURFS, POSTS } = require("src/core/consts.js");

const MX = 30, MY = 18, HUD = 28;           // yan boşluk (kaleler için), alt/üst boşluk, skor şeridi

function layout(W, H) {
  return { W, H, MX, MY, HUD, VW: W / 2 + MX * 2, VH: H / 2 + HUD + MY * 2, ox: MX, oy: HUD + MY };
}

function circle(c, cx, cy, r, col) {            // piksel daire çizgisi (orta nokta algoritması)
  c.fillStyle = col;
  let x = r, y = 0, e = 1 - r;
  while (x >= y) {
    for (const [px, py] of [[x, y], [y, x], [-y, x], [-x, y], [-x, -y], [-y, -x], [y, -x], [x, -y]]) c.fillRect(Math.round(cx + px), Math.round(cy + py), 1, 1);
    y++;
    if (e < 0) e += 2 * y + 1; else { x--; e += 2 * (y - x) + 1; }
  }
}

// o: { gfx: 0-2, fans: bool, frame: 0|1, turf: çim indeksi, post: direk indeksi }

const KEY = 'pf_settings_v2';

// Dokunmatik kontroller: merkez konumu (görünüm genişliği/yüksekliğine oranla), boyut çarpanı ve şeffaflık
// yön: portrait / landscape ayrı saklanır (cihaz döndürülünce kendi düzeni gelir)

  portrait: { joy: K(0.22, 0.84, 1, 0.7), shoot: K(0.82, 0.86), pass: K(0.60, 0.91), skill: K(0.84, 0.69) },
  landscape: { joy: K(0.14, 0.72, 1, 0.7), shoot: K(0.90, 0.78), pass: K(0.79, 0.84), skill: K(0.84, 0.58) },

const clone = (o) => JSON.parse(JSON.stringify(o));

    else if (it.cat === 'boot') st.background = C.BOOTS[it.val][0];
    else if (it.cat === 'emoji') txt = C.EMOJIS[it.val];
    else if (it.cat === 'ttl') txt = C.TITLES[it.val];

    else if (it.cat === 'hair') txt = '✂';

    if (k === 'class') e.className = v; else if (k === 'text') e.textContent = v;

/* Bot yapay zekâsı: her bot için p.in alanlarını (ax, ay, btn, act, charge) doldurur.

function nearestOpp(sim, team, x, y) {

    if (o.team === team) continue;
    const dx = o.x - x, dy = o.y - y, d = dx * dx + dy * dy;
    if (d < m) m = d;
  }

    const t = clamp((ox * dx + oy * dy) / dd, 0, 1);
    const ex = ox - dx * t, ey = oy - dy * t;
    if (ex * ex + ey * ey < 700) return true;
  }

function bestMate(sim, p, dir, pressure) {

function think(sim, p) {

  ai.btn = 0;

}
